[package]
name = "viva-tui"
version = "0.1.0"
edition = "2021"
description = "A full-screen client for the viva daemon."
license = "Apache-2.0"

[[bin]]
name = "viva-tui"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CommonMark, rather than a parser of my own accumulating special cases.
pulldown-cmark = { version = "0.13", default-features = false }
# Text is measured in cells with the two crates ratatui draws it with.
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
strip = true
opt-level = "z"
lto = true
