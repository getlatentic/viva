[package]
name = "vivarium-tui"
version = "0.1.0"
edition = "2021"
description = "A full-screen client for the vivarium daemon."
license = "Apache-2.0"

[[bin]]
name = "vivarium-tui"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
