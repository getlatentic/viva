  "reconstruction tax and its ratio, quantified per the definition in the notes, for every arm",
  "state-authoring tax measured, so the explicit arm is charged for what it costs while running and not only for what it saves on recovery",
  "a statement of whether any in-flight information exists that the ledger cannot carry",
  "if B wins, the specific tasks it wins on -- a mean is not an answer here",
]
kills_it = "A2 matches B on durability tax, not merely on score -- reconstruction tax near zero and no state-authoring premium large enough to cancel it. Then live continuation is decoration on a sufficient ledger, Smalltalk's remaining advantage buys nothing measurable, and the substrate question closes in vivarium's favour for good."

