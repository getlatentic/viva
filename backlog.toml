  restart / plumbing            = SHAM      - FULL
  effect of distillation        = DISTILLED - SHAM
  effect of discarding it       = LEDGER    - SHAM
  distilled cognition beyond
    authoritative facts         = DISTILLED - LEDGER

The summariser is frozen on model, temperature, prompt, schema, max output and
INPUT BOUNDARY: DISTILLED may see only what existed before the fork -- no
post-checkpoint results, no reference fix, no evaluator output, no cases.

