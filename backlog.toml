[[settled]]
ref   = "E1"
claim = "An isolated trial in a live image costs milliseconds."
result = "Holds. Fork 28-32ms, saved core 75ms, cold start 2600ms, in-process 0.12ms. SBCL refuses to fork multi-threaded, so a zygote is mandatory and the serving image can never fork. Parallel fan-out barely beats sequential."

[[settled]]
ref   = "E2 claim 2"
claim = "A Pareto frontier beats greedy keep-best."
result = "Holds, narrowly: the frontier converts a hard trap into a budget question at a measured 10x price. Greedy frozen at n=12 at every budget; Pareto reaches the global optimum at 600. NOT 'Pareto wins at equal budget'."

[[settled]]
ref   = "E3 mechanism"
claim = "Mutating a live agent object changes what it can do on the next request."
result = "Built and tested: prompt and tool set read per request; abort-in-flight measured at 1,927ms vs 323,875ms. Whether it improves OUTCOMES is story S6."

[[settled]]
ref   = "E6"
claim = "What production harnesses fix at turn start versus re-read per request."
result = "DONE -- all four harnesses read. opencode re-reads prompt AND tools per request (prompt.ts:1088 loop, SessionTools.resolve inside it, LLMRequestPrep.prepare per run) with a plugin hook for rewriting the prompt, so 'resolved at startup' is false in general. But resolveTools is a FILTER that never adds, so no harness can acquire a tool absent at session start. Answered for Codex, Pi and Claude Code. Claude Code's control protocol accepts set_model, set_permission_mode, interrupt, stop_task, rewind_files, mcp_toggle -- no set_system_prompt, no set_tools. mcp_toggle is a PRE-REGISTERED server on/off. opencode remains unread (S2)."

[[settled]]
ref   = "B7 / substrate"
claim = "The ledger is a fourth architectural primitive, not vivarium plumbing -- and it survives whichever runtime wins."
result = """Four primitives, not three runtimes: SBCL makes CODE BECOME DATA, Smalltalk makes CAPTURED COMPUTATION BECOME DURABLE, BEAM makes PROCESSES BECOME DISPOSABLE, and the LEDGER makes HISTORY BECOME AUTHORITATIVE.

CAPTURED computation, not computation: the durable unit is the image and the process state inside it. External resources are NOT carried and have their own restoration semantics, which B7 measured -- a registered ZnServer's listener is re-created on resume, an unregistered one comes back reporting isRunning TRUE and isListening FALSE, and a file stream held open across a snapshot returns closed. Read "durable" as "the captured heap and stacks", never as "sockets, handles and external services survive".

AUTHORITATIVE is a property that has to be ENFORCED, not a description of a component that exists:

  ledger exists  !=  ledger is authoritative

  authoritative = every durable transition passes through it
                + runtime state can be RECONCILED against it

The path is: persistent mutation -> ledger first (source/representation, provenance, parent version, evidence, intended transition) -> compile and install -> evaluate -> promotion recorded. Anything mutating durable behaviour outside that path must be impossible or detected as divergence. B7's M3 and M5 are what makes this concrete rather than aspirational: a method installed off the path still runs but reports its arguments as (arg1, arg2) with no description, and NOTHING REPORTS THE NAMES MISSING. Enforcement is story B9, and the invariant holds across all three substrates.

All three runtime models still need provenance, candidate history, evaluation evidence, rollback knowledge, durable source and promotion decisions, and none of them supplies those. B7 measured that twice from opposite directions: a Smalltalk image is not self-sufficient as source-level memory (move .changes aside and a live method reports #(#arg1 #arg2) with a nil comment while still returning 42.0), and BEAM pushes durability outside the VM entirely (process state is volatile across node death; Mnesia or another store is required). So the ledger is what makes the three runtimes safe enough to COMPARE, and it is the one component no substrate decision can retire."""

[[settled]]
ref   = "B12 / architecture"
claim = "The substrate stories are converging on one architecture, not competing for one slot."
result = """Recorded because it emerged from reading rather than from measuring, and
because it changes what the remaining stories are FOR. Vivarium's identity is
propose -> isolate -> evaluate -> select -> promote -> provenance -> reconcile.
Everything else is a choice it makes ABOUT a promoted change, not a rival to it:

  EVOLUTION CONTROLLER   propose, evaluate, select          vivarium
        |
  PROMOTED CHANGE
        |
        +-- EXECUTION BOUNDARY   crash, CPU and memory containment
        |                        BEAM, OS process            -- B8
        |
        +-- EFFECT BOUNDARY      own and revert effects,
        |                        withdraw dependencies
        |                        Cordis semantics            -- B12
        |
        +-- REPLACEMENT POLICY
        |     RevertAndReapply (Cordis) | MigrateState (OTP)
        |     | CaptureAndContinue (Smalltalk)
        |
        +-- LEDGER  ->  reconciliation                       -- B9

THE TWO BOUNDARIES DO NOT SUBSTITUTE, and the Cordis paper settles it rather
than us inferring it: S6.3 says language-level component mediation "is
insufficient" for untrusted code because a malicious component "can reach the
underlying objects directly", and strong isolation still needs a process,
runtime or container. Conversely a supervisor restarting a process does not
withdraw what the dead process registered elsewhere. B8 measures the first, B12
the second.

THE REPLACEMENT POLICIES ARE ALSO NOT RIVALS -- they answer the same question
three ways, and which one a given mutation deserves is a decision vivarium is
positioned to make: Cordis reverts and reapplies from a clean boundary, OTP
migrates state forward through code_change/3, Smalltalk continues the same
computational organism. B7 measured the third and B10 could not show it pays on
the current workload; that is a fact about the workload, not a refutation.

B11 asks the orthogonal question the diagram does not contain: what cognitive
state should cross a version boundary at all -- ledger only, distilled
cognition, full transcript, or full continuation.

ATTRIBUTION, and it matters if any of this is ever written up. BOTH TAXONOMIES
ABOVE ARE VIVARIUM'S SYNTHESIS, NOT CORDIS'S:

  ReplacementPolicy = RevertAndReapply | MigrateState | CaptureAndContinue
    Cordis, OTP and Smalltalk motivate the three cells. None of them presents
    the taxonomy; it is ours, assembled from three systems that each occupy one
    cell without naming the others.

  Effect = Revertible | Compensatable | Irreversible
    Cordis S6.1 supplies the acquisition/emission boundary and discusses
    inversion, withholding and compensation. It does NOT present these three as
    a formal classification. The categories are ours.

Cite the paper for the boundary and the mechanisms; do not cite it for either
taxonomy.

WHAT THE ARCHITECTURE BUYS, and the reason to stop editing it: four questions
that were previously one.

  1 SHOULD THIS CHANGE SURVIVE?      propose, isolate, evaluate, select,
                                     promote                        vivarium
  2 HOW DOES AN ACCEPTED CHANGE      own effects, withdraw dependencies,
    LEAVE?                           revert or compensate                B12
  3 WHAT CROSSES FROM OLD VERSION    the replacement policy
    TO NEW?                          RevertAndReapply | MigrateState |
                                     CaptureAndContinue                  B8
  4 WHAT COGNITION SHOULD SURVIVE?   ledger | distilled | transcript |
                                     full continuation                   B11

with B9 underneath all four: evolutionary history -> authoritative ledger ->
expected projection -> compare against runtime introspection -> divergence is a
failure. Neither Cordis's effect tracking, nor OTP supervision, nor Smalltalk
continuity establishes that the running system still matches its history.

State continuity, effect cleanup, execution containment and evolutionary
selection were being treated as one problem. They are four.

WHAT THIS IS NOT: a plan to build that architecture. It is the reason the
remaining stories are worth running in the order they are in.

FROZEN 2026-08-11. No new substrate concepts unless an experiment forces one.
The next thing that happens is B11, not more architecture."""

[[settled]]
ref   = "B8 + B12 / the author obligation"
claim = "Every containment and recovery mechanism in both runtimes is declared by the component being contained. An agent authoring the component can decline it."
result = """Three independent measurements, two runtimes, one shape. Recorded as settled
because the third instance is what turns it from a Cordis observation into a
property of the class of mechanism.

  B12    the inverse        author-supplied, unverified   silent bad unload --
                                                          Cordis reports DISPOSED
                                                          with no error
  B8/3   code_change/3      author-supplied, unverified   silent bad migration --
                                                          the process keeps
                                                          serving and says nothing
  B8/1   the dirty-NIF      author-declared, unenforced   a node that ignores
         scheduler flag                                   SIGTERM

The last one is the sharpest because the mitigation demonstrably WORKS. The same
non-yielding busy loop wedges the node on normal schedulers and merely degrades
it on dirty ones -- measured, both directions. What decides which happens is a
flag in the NIF's own ErlNifFunc table, set by the code being contained, with no
VM option to force it.

WHY THIS IS NOT A CRITICISM OF EITHER RUNTIME. Both designs are sound for the
author they were built for: a person, writing a component, subject to review.
Cordis says as much (S5.1.1). The assumption only becomes load-bearing when the
author IS the system, and then it inverts -- the entity whose mistakes the
mechanism exists to contain is the entity asked to configure the containment.

WHAT FOLLOWS, and it is the same conclusion by three roads:

  1. RECONCILIATION IS SUBSTRATE-INDEPENDENT and cannot be delegated to a
     runtime. Expected = projection(ledger), actual = introspection(runtime).
     Neither Cordis's effect tracking nor OTP's code_change establishes that the
     running system still matches its history.
  2. A PRE-INSTALL REVIEW GATE IS CHEAPER THAN A POST-HOC DETECTOR where the
     declaration is checkable -- refuse a NIF without the dirty flag, refuse a
     component whose declared contributions and tracked effects disagree. B12
     measured the limit of this: it catches OMISSION and is defeated by a
     component that declares the right thing and does another. So it is a filter,
     never a proof, and B9 remains necessary underneath it.
  3. THE ONLY BOUNDARY THAT HELD FOR EVERY FAULT CLASS TESTED is the one E1
     measured and vivarium already uses: a separate OS process. Both
     language-level answers -- effect containment and intra-VM execution
     containment -- are partial, and partial in ways an autonomous author
     controls."""

[[settled]]
ref   = "B11 + B12 / state placement"
claim = "State expected to survive replacement must not live inside the replaceable thing. Implicit state is convenient; explicit state is evolvable."
result = """The first rule two stories reached independently, from opposite directions and by
different instruments, which is why it is recorded as settled rather than as
either story's finding.

  B11, from COGNITION.     Compression works; the restart it requires does not
                           pay for it. What survives a version boundary usefully
                           is the named, authoritative record -- not the raw
                           trajectory, and not a summary of it.
  B12, from COMPONENT      Cordis reverts and reapplies from a clean slate, so
       REPLACEMENT.        component-local state does not survive replacement and
                           rebuilds from nothing. The SAME state one indirection
                           away, in a longer-lived dependency, survives at zero
                           cost.

So the distinction vivarium should draw is not durable-vs-volatile but

  COMPONENT STATE   disposable implementation state, dies with its component
  EVOLUTION STATE   explicitly durable, named OUTSIDE the component that uses it

and the candidates for the second are nameable in advance: agent working memory,
learned skills, experiment history, provider/model state, long-lived caches,
identity, goals.

WHAT IT DOES NOT SAY, because two convergent measurements are not a proof: not
that explicit cognition is universally sufficient. B10 tried to establish that
and halted. The claim is about state that must CROSS a boundary -- a context
compression, a component replacement, a process restart, a substrate change --
and it is silent about state that never crosses one.

THE REASON IT IS ARCHITECTURE AND NOT ADVICE: naming state as a dependency is
cheap at authoring time and impossible to retrofit at replacement time. The
component that held it is already gone."""

[[settled]]
ref   = "B12 / effect boundary"
claim = "Effect containment establishes PROTOCOL COMPLIANCE. It cannot establish SEMANTIC CORRECTNESS. Reconciliation supplies the missing proof obligation."
result = """The distinction is the result, and it is measured rather than inferred:

  Cordis guarantees    "I executed the recovery protocol registered for this
                        component."                          PROTOCOL COMPLIANCE
  vivarium asks        "Did executing that protocol produce the authoritative
                        expected state?"                     SEMANTIC CORRECTNESS

Different guarantees. The paper is explicit that the implementation TRUSTS the
inverse a component supplies rather than verifying it (S5.1.1), so the failures
below are not Cordis bugs. What the experiment shows is that AUTONOMOUS COMPONENT
GENERATION makes that design assumption far more consequential than it is for a
human-authored plugin: a discipline problem becomes a correctness problem, and it
is silent.

Measured against cordis 4.0.0-rc.8, the reference implementation, on four
variants of one agent-shaped capability run through a complete lifecycle.

CORDIS REPORTS A CLEAN UNLOAD FOR EVERY FAILURE MODE AN AGENT-AUTHORED COMPONENT
EXHIBITS -- a faithful component, one whose inverse reverts nothing, one that
never called ctx.effect, and one that registers the right label with no deed all
come back DISPOSED, no error, no retained effects. That is correct behaviour:
S5.1.1 says the inverse's correctness "is an obligation on the component author
rather than a property the runtime verifies". It is also exactly the class B9
exists for.

The pre-unload introspection surface does not close the gap. getEffects() catches
OMISSION -- the untracked variant shows 2 effects where the others show 5 -- but
EffectMeta carries {label, children} and the label is a free author-supplied
string, so a no-op under the missing label restores the appearance. Only
reconciliation catches all three.

  Cordis alone           detects none of the three
  reconciliation alone   detects all three, but withdraws nothing correctly --
                         no guard, no ordering, no per-fiber failure isolation
  the pair               structural rollback plus empirical verification

WHAT CORDIS SUPPLIES THAT VIVARIUM WOULD NOT HAVE BUILT, and each was verified
against the paper before being measured:

  THE GUARD (Theorem 63). A provider withdraws a binding only after every
  consumer that resolved it has gone, so a teardown can still use the coeffect it
  is losing. Proved to be the guard and not LIFO by registering the provision
  LAST, where pure LIFO would revert it FIRST: the trace is byte-identical.

  TERMINAL PER-COMPONENT FAILURE (L-Raise). A failed activation installs nothing,
  leaves siblings running, and is WITHHELD rather than retried against an
  unchanged environment.

  STANDING DECLARATIONS. A consumer whose provider leaves lands in PENDING, not
  DISPOSED, and reactivates unaided when the key returns.

THE GUARANTEE IS CONDITIONAL ON EXPRESSING THE DEPENDENCY AS A COEFFECT. The
guard orders along coeffects and not along the fiber tree (p35), and the same
shape as a parent-held resource gets no ordering at all -- measured. A generated
component must be constrained to the protected form; it does not inherit it.

STATE THAT MUST CROSS A VERSION BOUNDARY MUST BE NAMED AS A DEPENDENCY RATHER
THAN HELD. Component-local state does not survive replacement; the same state one
indirection away does, at zero cost. B11 reached the same shape from the other
direction, which is the first time two of these stories have converged on one
rule from independent measurements.

EFFECT CONTAINMENT DOES NOT SUBSUME EXECUTION CONTAINMENT, now measured rather
than quoted: ctx.isolate isolates the realm a coeffect KEY resolves in, and a
component reached ambient state straight through it. B8 keeps its own question.

THE EFFECT TAXONOMY SURVIVED CONTACT AND EARNED A FIELD. The probe's component
produced all three classes, which is the point -- "every effect needs an undo" is
not a sufficient model for an autonomous agent. B12 justifies the shape without
justifying building it yet:

  Effect { class, inverse?, compensation?, verification? }

  Revertible      the runtime restores the expected state, given a correct
                  inverse                       tool, listener, policy, handle
  Compensatable   history cannot be erased; a semantic counter-action exists
                                                the audit line, a notification
  Irreversible    neither rollback nor satisfactory compensation
                                                needs approval or a commit
                                                barrier BEFORE promotion

`verification` is the field B12 argues for that the taxonomy did not previously
have: the three failure modes above are exactly what an unverified inverse looks
like, and the class alone does not distinguish a component that CAN be reverted
from one that WAS. S6.1 supplies the acquisition/emission boundary this rests on;
the three-way classification remains VIVARIUM'S and must not be cited to the
paper. Its warning transfers though: compensating actions compose in the same
LIFO order as inverses, but the metatheory does not -- commutation is proved
against the fine equivalence and "has to be re-established against the coarser
one" (p68). Compensation is not a drop-in extension of the guarantee."""

[[settled]]
ref   = "B11 / context"
claim = "Compression of an agent's conversational context is worth doing; the restart used to deliver it is not."
result = """Measured, 34 usable pairs across 7 tasks and 6 families. The two effects are
separable and point opposite ways:

  compression itself   USEFUL      LEDGER - SHAM  =  -2,400 tokens, 25/34
  restart itself       EXPENSIVE   SHAM   - FULL  =  +3,000 tokens, 31/34
                                                     -------------
  the combination lost             LEDGER - FULL  =    +600 tokens, 22/34

Score is flat throughout -- FULL +0.016, DISTILLED -0.010, LEDGER -0.057
against SHAM -- so nothing is bought or lost there and the efficiency numbers
mean something.

THE OPERATIONAL RULE, available to any harness today and independent of
substrate: DO NOT RESTART IN ORDER TO COMPRESS. If a restart is happening
anyway, reconstruct from the ledger rather than replaying the full transcript;
it costs about 0.06 of score.

DISTILLATION AS SPECIFIED LOST TO THE TRANSCRIPT IT REPLACED: +1,698 tokens
against SHAM before the restart is even counted, +4,687 against continuing, at
6.18 turns against FULL's 2.68 -- with the summariser's own call charged to it,
which is what made the loss visible instead of flattering. Scope: ONE FROZEN
SUMMARISER, one prompt, one call, untuned by construction. A result about that
distillation, not about distillation. Tuning it until it wins and still calling
it B11 is forbidden; B13 is where the separable question goes.

WHAT THIS DOES NOT SETTLE. Not "the ledger is sufficient cognition" -- FULL
still wins sometimes. Not anything about full computational continuation, which
was never an arm. The layered model that survives is: LEDGER authoritative,
TRANSCRIPT ephemeral working cognition, RUNTIME CONTINUATION not shown
necessary. B7's capability still has no workload-level reason to migrate, B8
stays live because explicit state has not been shown inadequate, and B12 is
untouched -- B11 says nothing about removing a promoted change cleanly."""

[[settled]]
ref   = "B11 / method"
claim = "A harness optimisation observed on tasks designed for another property needs cross-family replication before it becomes architecture."
result = """Stronger than "benchmarks matter", and B11 supplies the demonstration rather
than the warning. B10 stage 1 noticed ledger restart finishing in 4.6 turns
against 6.5 -- incidental, on family D, which had been built to test
path-dependence and was then shown not to have it. B11 deliberately did not
inherit that task set. The observation split:

  LEDGER - FULL   family D, B10's original ground   -2,229   cheaper 7/10
                  the five tasks outside it         +1,774   cheaper 5/24

IT REPLICATES EXACTLY WHERE IT WAS FIRST SEEN AND REVERSES EVERYWHERE ELSE. Had
B11 reused B10's tasks it would have confirmed a local property as a general
one, with a pre-registration and a paired control lending it false weight.

The rule generalises past this instance: an effect noticed while measuring
something else is a hypothesis about the tasks in front of you until it is
re-measured on tasks chosen for it. It also cost nothing to apply here -- the
cross-family spread was one line of the pre-registration and it turned a wrong
architectural conclusion into a measured boundary."""

[[settled]]
ref   = "harness"
claim = "The image is a viable agent world."
result = "Arm A repairs a broken definition in a running image (TYPE-ERROR to 35, verified by calling it) and extends itself mid-run (7 tools to 8, no restart). 272 assertions green."

