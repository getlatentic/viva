[[story]]
id       = "B6"
sprint   = 0
title    = "How does a SERVING image keep its improvements?"
labels   = ["backlog", "risk"]
status   = "backlog"
size     = "L"
depends_on = []
as_a     = "researcher"
i_want   = "a way for a multi-threaded serving image to survive a restart with its accumulated state"
so_that  = "the advantage this whole project measures is not lost the moment the process exits"
notes = """
MEASURED 2026-08-11, and it is a hole in the thesis rather than a chore.

Two persistence mechanisms exist and they solve opposite halves:

  LEDGER      carries CODE across processes. Replay (target, source) into a
              fresh image and the definitions come back. Verified. Small,
              selective, and works while the image keeps serving.
              But the STATE DOES NOT CROSS -- replaying into a fresh process
              gave back the function and left *EVENTS* empty. That is exactly
              what a directory of files already gives you, so on its own the
              ledger buys nothing over the file world.

  SAVED CORE  carries EVERYTHING. Verified: definitions, 5000 accumulated
              events, and a CLOSURE over a runtime value (returned 42 from a
              captured 41) -- the one thing no source can reconstruct, and T8's
              whole premise. 58 MB, and a new process starts from it in 0.06s,
              matching E1's measured 75ms.
              But save-lisp-and-die REQUIRES A SINGLE THREAD (same constraint as
              fork) and the name is literal: IT KILLS THE PROCESS. A serving
              image cannot checkpoint itself and stay up.

So: durability and availability currently trade against each other, and the
thing the benchmark says is the image's advantage -- accumulated live state --
cannot survive a restart in the one configuration that matters, a serving image.

docs/README.md already concedes the adjacent half: "the zygote's warm state is
loaded code and fixtures, not the serving image's live sessions." This measures
what that concession costs.

SOLVED IN PRINCIPLE 2026-08-11, by asking what Smalltalk does.

Pharo has snapshot:andQuit:false -- backupImageInFileNamed: "continues
evaluation in the original image after saving". Smalltalk simply does not have
this problem, and the reason is not magic: ITS CONCURRENCY LIVES INSIDE THE
IMAGE. Processes are objects scheduled by the VM within one OS thread, so the OS
process is always single-threaded, checkpointing is always available, and
suspended Processes are saved as objects and resume on load. SBCL's threads are
OS threads, which cannot be serialised into a heap -- which is exactly why
save-lisp-and-die demands exactly one.

SBCL CAN RECONSTRUCT IT, measured:

  fork, then let the CHILD save-lisp-and-die while the PARENT continues.
  Copy-on-write gives the child the whole heap. Verified end to end --
  parent kept running with its 5000 events and its closure intact,
  child wrote a 35 MB core, whole operation 388 ms, and the restored
  core had the events, the closure (still returning 42 from a captured
  41) and the function.

CORRECTED, and the first version of this note overclaimed. A restored core
preserves DATA, not CONTROL FLOW. Measured: a snapshot taken mid-loop at step 5
restores with counter=5 and 5 steps logged -- the data as of that instant is
exact -- and then does NOT continue the loop. It starts at :toplevel. Smalltalk
resumes suspended Processes because a Process is an object in the image carrying
its own stack; SBCL has no equivalent, so anything in flight at snapshot time is
simply not in flight afterwards.

For accumulated state -- events, sessions, caches, the closures in *DEFERRED* --
this costs nothing, and it is exactly what the task set models, because E1's
no-threads constraint already forced in-flight work to be represented as DATA
rather than as running threads. For a server with requests actually in progress
it is a real loss and has to be designed around: drain before snapshot, or
accept that in-flight requests die and are retried.

So this is not a limitation of the substrate. It is a CONSTRAINT ON THE SERVER:
green threads or an event loop keeps the OS process single-threaded, and then
snapshot-while-serving is available for ~400ms. OS threads buy conventional
concurrency and cost both fork and checkpointing. E1's "SBCL refuses to fork
with more than one thread" was read as a fact forcing the zygote; it is better
read as a design choice about how the server does concurrency.

The other half is worth keeping in view, because Smalltalk pays for its
durability. Because the image persists everything forever it becomes
unreproducible and unmergeable -- image rot, "works in my image", and the whole
Monticello/Metacello/Tonel lineage exists to claw source back out into files.
THE LEDGER IS AN ANSWER TO EXACTLY THAT: per-definition records with previous
source, replayable, reviewable, merging per definition rather than per line.

PRIOR ART, checked from source and docs -- do not re-research:

  SMALLTALK (Pharo)  snapshot:andQuit:false, and it resumes MID-COMPUTATION. Concurrency is INSIDE the image:
                     Processes are objects scheduled by the VM in one OS thread,
                     so checkpointing is always available and suspended
                     processes resume on load. Durability: YES.
                     Price: the artifact is a binary heap -- image rot,
                     unreproducible, hard to diff or merge. Monticello,
                     Metacello and Tonel all exist to claw source back into
                     files.

  ERLANG/OTP         Hot code upgrade with TWO live versions of a module, and
                     code_change/3 migrating a gen_server's state in place --
                     a direct analogue of CLOS update-instance-for-redefined-class
                     and therefore of T3. Live state survives the CHANGE.
                     But the docs are explicit that PROCESS STATE DOES NOT
                     SURVIVE A NODE RESTART: it is volatile, and the supervision
                     tree recreates processes from scratch. Durability is pushed
                     OUTSIDE the VM (Mnesia, DETS, external stores) and paired
                     with let-it-crash.

So Erlang is the industrial existence proof of B6's third option -- declare live
state ephemeral and put durability elsewhere. It is a real choice, not a
cop-out, and it should be argued against rather than ignored.

DESIGN TRAP worth naming now. A core cannot be merged. If a variant became a
core rather than a set of ledger entries, E2 claim 1 dies and Smalltalk's exact
weakness comes back. Keep the two separate:
  GENOME = ledger entries -- heritable, mergeable, reviewable, tiny
  CORE   = checkpoint     -- complete, durable, unmergeable, 35-58 MB
Lineage branches the genome. A core is a restore point, orthogonal to lineage.

Neither Smalltalk nor Erlang has both halves. This project could.
"""
acceptance = [
  "a serving image that survives a restart with its accumulated state -- the fork-and-save mechanism is demonstrated, so what remains is doing it under a green-threaded server that is actually serving",
  "the cost measured: checkpoint time, core size, and whether the server stays up during it",
  "if it cannot be done, the thesis narrowed in the docs rather than left implied",
]
kills_it = "The ~400ms fork-and-save pause is unacceptable under real traffic, or a green-threaded server cannot carry the load the threaded one does. Then the trade is real and live state is ephemeral in any serving configuration."

[[story]]
id       = "B7"
sprint   = 0
title    = "Smalltalk probe: does the durability advantage show up in outcomes?"
labels   = ["backlog", "spike", "risk"]
status   = "backlog"
size     = "M"
depends_on = []
as_a     = "researcher"
i_want   = "three measurements on Pharo, not a port"
so_that  = "the substrate question is decided by evidence rather than by which architecture diagram reads better"
notes = """
SPINOFF, deliberately outside the main line. Runs in its own session and must not
consume the vivarium track.

Smalltalk is more genuinely an image than SBCL is, and the project's question is
about images -- so the substrate choice deserves evidence rather than loyalty.
What makes it a probe and not a port: three questions, no task set, no harness.

  1. SNAPSHOT UNDER LOAD. Pharo's snapshot:andQuit:false while something is
     actually serving. How long is the pause, and are in-flight requests lost?
     SBCL's fork-and-save costs ~388ms and loses control flow entirely.
  2. RESUME MID-COMPUTATION. Start a long computation, snapshot, restore,
     confirm it CONTINUES. This is the one thing SBCL provably cannot do:
     a core taken mid-loop at step 5 restores with counter=5 and then starts
     at toplevel rather than finishing the loop.
  3. DERIVED SCHEMA. Read a tool schema off a live method -- selector keywords
     give argument names, reflection gives the rest. The load-bearing claim of
     this whole project, tested on the other substrate.

WHY NOT SWITCH NOW, so the spinoff does not turn into a migration: nothing
currently open depends on B6. Trials are ephemeral by design (fork, score,
_exit) and E4's self-edits need to survive a TURN, not a process death. And the
ledger would still be needed on Pharo -- image rot, unreproducible artifacts and
the whole Monticello/Metacello/Tonel lineage are what a per-definition ledger
answers. Switching restarts the INSTRUMENT, which is the scarce thing: every
measured number here is SBCL-specific.

Pharo is not installed on this machine.

"""
acceptance = [
  "a number for the snapshot pause under load, beside SBCL's 388ms fork-and-save",
  "resume-mid-computation demonstrated or shown not to work in practice",
  "a tool schema derived from a live method, or a written reason it cannot be",
  "a recommendation with a trigger: what result would make switching correct",
]
kills_it = "Pharo's snapshot pause under load is no better than SBCL's, or resume-mid-computation is fragile in practice. Then Smalltalk's advantage is architectural rather than measurable and the substrate question closes in vivarium's favour."

[[story]]
id       = "B8"
sprint   = 0
title    = "BEAM probe: does supervision beat fork for containing a bad mutation?"
labels   = ["backlog", "spike", "risk"]
status   = "backlog"
size     = "M"
depends_on = []
as_a     = "researcher"
i_want   = "three measurements on Erlang/Elixir, against SBCL numbers that already exist"
so_that  = "the strongest argument against this substrate is tested rather than admired"
notes = """
SPINOFF, sibling to B7. A PROPERTY PROBE, NOT A TASK-SET PORT.

The case for BEAM is real and was under-weighted: self-improvement's
characteristic failure mode is that a component eventually emits bad code, and
OTP is the runtime built around exactly that. Hot code loading keeps two module
versions live and code_change/3 migrates state -- both parts of the execution
model rather than bolted on.

WHY NOT "THE SAME TASKS ON ALL THREE". The task set is Lisp-specific BY
CONSTRUCTION: T3 is update-instance-for-redefined-class, T8 is closures over
runtime values, T16 turns on REMOVE-DUPLICATES defaulting to EQL, T17 is the
ledger's introspection fallback. Porting them produces ANALOGOUS tasks, and then
two different benchmarks get compared and called a substrate result. That is the
confound harness-lineage.md already warns about -- "do not compare file-Pi
against image-single-tool" -- at larger scale.

THREE QUESTIONS, each with an SBCL number already measured to compare against:

  1. CONTAINMENT. Have an agent install code that wrecks the runtime -- exhaust
     the atom table, wedge the code server, spin in a NIF. Does supervision
     contain it, or does the node go down? SBCL's fork contains ANY child
     failure by construction (E1: a child that corrupts its heap cannot touch
     the parent) at 28-32ms per trial. BEAM process isolation is INTRA-VM and
     may be weaker for this specific failure, which is the opposite of the
     conventional reading.
  2. CODE-GENERATION IMPEDANCE. Time and error rate for an agent to generate,
     compile and load a function at runtime. Erlang has no homoiconicity:
     abstract format is tagged tuples, not the language's own literals. This is
     BEAM's weakest cell AND the operation that happens every single turn, so it
     carries the most information. Compare against install: read one form,
     compile into the image, done.
  3. HOT UPGRADE WITH STATE. code_change/3 migrating a gen_server's state --
     the direct analogue of T3, which neither model has solved in vivarium.
     Does the runtime making it first-class change the outcome?

DO NOT MEASURE: throughput, distribution, syntax. E1 already showed parallel
fan-out barely beats sequential (28.3 vs 31.8ms), so distribution is a
capability with no demonstrated requirement here.

THE DEEPER POINT, which belongs in HANDOFF.md rather than here: the three
substrates encode three DIFFERENT DEFINITIONS of self-improvement --
  SBCL      the agent is a program that rewrites programs
  Smalltalk the agent is a computational organism that persists
  BEAM      the agent is a society that survives by replacing members
The headline question presupposes the first two. Erlang's framing is not another
implementation of it; it is another question. That choice has never been made
explicitly and should be.

Asymmetry worth keeping in view when reading the result: supervision, isolation,
restart and versioning are PATTERNS you can build -- this project already has
fork isolation, a ledger, and rollback. Homoiconicity is not obtainable as a
library.
"""
acceptance = [
  "containment measured: does a runtime-wrecking mutation take the node down, beside SBCL fork's guarantee that it cannot",
  "code-generation impedance measured as time and error rate, beside install",
  "a recommendation with a trigger: what result would make BEAM the right substrate",
  "no task-set port -- if the probe starts porting tasks it has become a rewrite and should stop",
]
kills_it = "Supervision does not contain a runtime-wrecking mutation any better than fork already does, and code-generation impedance is materially worse. Then BEAM's advantages are ones this project can build, and the substrate question closes."

