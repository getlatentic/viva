the same work more cheaply.

THE CLAIM WORTH TESTING, stated so it can fail: for agentic repair, accumulated
conversational context carries enough irrelevant exploratory history that
deliberate compression improves performance. If true it is immediately useful and
has nothing to do with Smalltalk.

THREE ARMS, one variable:
  FULL        carry the whole transcript, as every harness does today
  DISTILLED   periodically replace the transcript with a structured summary
  LEDGER      restart from the ledger recap alone, as B10's A1 arm did

MEASURE: task score first -- the B10 observation is only interesting if score
holds -- then turns, tokens, and repeated tool calls.

WHY IT IS NOT ALREADY ANSWERED BY B10: B10's A1 arm was built as a BASELINE for
something else and was never optimised or varied. It is one point, observed
incidentally, on tasks chosen for a different property. A one-point observation
is a reason to run an experiment, not a result.

CAUTION FROM B10, and it is the whole reason this is a story rather than a
conclusion: B10 twice mistook a proxy for a property -- run length for
path-dependence, then a legible interaction for a search. The obvious failure
here is the mirror image: family D tasks may simply be ones where the transcript
adds nothing, in which case this measures the task set. Run it on tasks OUTSIDE
