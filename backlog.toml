  model HELD CONSTANT ACROSS ARMS is fine for "does harness B beat harness A" --
  which is exactly what A1 vs A2 is, both on SBCL. Reading B10 as "decides a
  substrate question" confused the STAKES of the conclusion with the SHAPE of the
  comparison.
  Train-split baseline to hold runs against (gpt-oss-120b, S2c): T1 1.00, T4 1.00,
  T5 0.94, T7 0.83, T9 1.00, T11 1.00, T13 1.00, T14 1.00, T15 0.67, T17 1.00.
  Fallback if cost ever bites: local gpt-oss-20b on llama-server, which also has
  real seed control -- not chosen now, no S2c baseline and a 20B risks floor
  effects on T15 and T7.
  ELIGIBILITY RISK, settleable from stored trajectories rather than by spending:
  S2c's mean was 6.7 requests, so an ordinal-4 checkpoint lands with only ~2-3
  turns of typical work left, and on tasks solved at 1.00 it may not land at all.
  Count the ineligible tasks from S2c's trajectories BEFORE run 1; if too many,
  the GLOBAL ordinal moves. Per-branch budget is 8 post-checkpoint requests, well
  above the ~2.7 typically used, so a slow recovery arm is measured rather than
  censored.
  CORRECTED after review: the first figure was 3,000 requests, and it was
  inflated by a DESIGN mistake rather than by arithmetic. Two errors. Treating
  the sham as a full third condition over all 10 tasks, when its job is to
  calibrate a floor. And forking two ways, when the sham and A1 share both a
  prefix AND a control branch -- "continue uninterrupted" is the same treatment
  in both. FORK THREE WAYS: control, control', recovery. control vs control' is
  the sham, control vs recovery is the A1 tax, off the SAME prefix, so the floor
  is measured on exactly the runs it calibrates and on every pair rather than on
  a handful of separate ones. Cheaper and methodologically better.
  AND SPEND IS STAGED, NOT AUTHORISED UP FRONT:
    stage 1  A1 + sham, three-way   ~605 expected, 1,400 at the cap
    stage 2  A2, two-way            ~470 expected, 1,000 at the cap
             -- bought only if stage 1 clears the ladder. If A1 shows no tax
             above the sham floor, A2 is pointless and is never paid for.
  Only stage 1 is authorised. Sample tokens/request from one UNSCORED pilot pair
  via assistant-message-usage, price against stage 1's ceiling, decide before
  run 1. A substitution after run 1 discards every run before it.

  CHECKPOINT ORDINAL IS IMMUTABLE PER RUN. Solved-before-4 or terminal-at-4 is
  recorded as checkpoint_status = ineligible with a reason, never relocated to
  "tool result 3 just for this task" -- that is the researcher discretion the
  fixed ordinal exists to remove. If too many train tasks are ineligible, the
  GLOBAL rule changes and every task moves with it, before scored execution.

  A1 = CURRENT VIVARIUM RECOVERY SEMANTICS, and must not move in either
  direction. Not weakened into a strawman, and -- the likelier failure -- not
  quietly enriched because B10 wants some field. Add a field for B10's benefit
  and A1 stops being the baseline, at which point the A1 -> A2 delta measures
  nothing. Deliberate externalisation belongs in A2.

The paired control forks at the checkpoint (E1: 28-32 ms, full isolation) so both
arms inherit the SAME live image, ledger and 4-turn prefix -- the fork is the
control here, not an optimisation. And note what the checkpoint destroys: THE
AGENT'S CONTEXT, NOT THE IMAGE. The agent's process dies, the world it was working
on persists, and the question is what resuming costs. Destroying the image instead
would measure something vivarium never does.

STARTING FROM, because B7's session state is gone and should be: the source of
truth is the main checkout plus the committed probe files. NOT the worktree, not
the scratchpad VM installs, not any interactive environment state -- all of which
were wiped twice during B7 and cost nothing, because the reproducible artifact was
the recipe rather than the live environment. Which is the project's own thesis
arriving from an unexpected direction, and worth noticing before running an
experiment about what live state is worth.

DESIGN TRAP, from B7's M3 and M5 together: arm A must reconstruct from the LEDGER,
not from a saved core. A saved core carries data-but-not-control-flow and would
make arm A artificially weak, which is the same overclaim B7's first pass made.

Runnable on SBCL alone -- arm B needs no Smalltalk if in-flight work is
represented as DATA rather than as a stack, which B6 already gestures at. That is
the cheap version and it should be tried first: if representing in-flight work as
data closes the gap, Smalltalk's one genuine advantage is gone without a port.

WHAT THIS IS REALLY ASKING, and why it outgrew B7. There are two ways to make an
agent persistent, and they are different philosophies rather than different
implementations:

  PERSISTENCE BY STATE-MACHINE DESIGN     computation -> explicit state ->
                                          checkpoint -> new process ->
                                          state transition continues
                                          (Erlang, Temporal, durable execution,
                                          LangGraph-style checkpointing, actor
                                          persistence)

  PERSISTENCE BY COMPUTATIONAL CAPTURE    computation itself -> capture ->
                                          restore -> same computation continues
                                          (Smalltalk)

Essentially every modern agent system has chosen the first, and converts control
flow into explicit durable state as a matter of course. Nobody appears to have
measured what that conversion COSTS, because on the usual substrates the second
option does not exist. B7 established that it does exist and is operationally
affordable. So B8 is not one more Smalltalk test: it decides which of two models
of persistent agents this project needs, and the answer generalises past the
substrate question that produced it.

If explicit ~= native, the finding is that FOR THIS CLASS OF SELF-IMPROVING AGENT,
DURABLE COGNITION IS BETTER MODELLED AS EXPLICIT DATA THAN AS PRESERVED EXECUTION
STATE -- which retires Smalltalk's largest unique advantage for vivarium.

AND IT DECIDES B8, THE BEAM PROBE. There are three persistence philosophies, not
two: SBCL rewrites programs, Smalltalk persists a computational organism, BEAM
replaces supervised members. BEAM is NOT a fourth arm here -- and be precise about
what it does supply, because it is easy to over-credit: BEAM gives SUPERVISED
REPLACEMENT AROUND EXPLICIT STATE as a runtime primitive, NOT durability. Process
state is volatile across node death; a supervisor recreates children from scratch;
durability needs Mnesia or another external store. So BEAM supplies the
replacement half of arm A2 and leaves the durable half in the ledger, where
vivarium already has it.

The two stories therefore ask different questions -- B10: what does externalising
cognition into data COST? B8: IF explicit state is sufficient, does a runtime with
native process replacement, supervision and hot upgrade run it better? -- and this
one sequences the other:
  A2 ~= B  ->  explicit state is sufficient, and BEAM becomes HIGHLY relevant: the
               mature runtime for the model that won. Run B8.
  B >> A2  ->  captured computation carries what externalising loses, and BEAM's
               persistence philosophy has already lost the more fundamental
               contest. B8's containment and hot-upgrade axes stay worth
               measuring; its persistence argument does not.
Which is why this is the cheaper story to run first.

HALTED 2026-08-11, and the phrasing matters. NOT "explicit state wins" and NOT
"captured continuation is worthless" -- neither was measured. What was measured:

  B10 COULD NOT IDENTIFY THE VALUE OF CAPTURED CONTINUATION ON THE CURRENT
  VIVARIUM WORKLOAD.

Two attempts, two different mistakes, both instructive. Stage 1 on family D found
no reconstruction tax: recovery ran 4.6 turns against control's 6.5 at equal
score, and A1-S sat inside a sham band spanning -5,522 to +6,615. T18 and T20
returned IDENTICAL scores in all three arms across all five pairs -- run length
was not path-dependence. The calibration pair T22/T23 then gave a difference of
differences of -962 tokens, the wrong sign and an order of magnitude inside the
noise, because T22 was not path-dependent either: its "ordering interaction" is
written down in sum-invoice and an agent finds it by READING.

THE STRUCTURAL FINDING, which is the durable part:

  current coding tasks -> source, tests and live state all remain readable
                       -> the important facts are cheaply reconstructible
                       -> little measurable value in preserving implicit
                          search state

Any defect expressible in source is found by reading, and reading accumulates no
search state worth losing. Forcing elimination needs the answer to be illegible
in code -- the search must be over DATA. Whether such a task can be built while
the source stays fully readable is an open question about the task set.

DO NOT REOPEN BY BUILDING MORE SYNTHETIC TASKS. Two rounds of that produced two
proxies for the property and no measurement of it. Reopen when vivarium meets a
REAL task carrying expensive, reproducible investigative state -- at which point
the instrument in experiments/b10-paired-fork.lisp is built, validated and ready.

Total spend across both rounds: ~800k tokens.
"""
