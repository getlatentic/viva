#  vivarium backlog
#
#  Ordered by dependency, not by cost. The list is short at the top on purpose:
#  one story unblocks five, and nothing below it can start.
#
#  A sprint here is a vertical slice of the research journey, so the test of a
#  sprint is not "code shipped" but "the researcher can state one more claim and
#  defend it". A sprint that only builds machinery has shipped nothing.
#
#  Every story is in a sprint or has status = "backlog". No orphans.
#
#  status = "halted" means the story RAN and stopped without answering its
#  question, with the reason recorded and a reopen condition stated. It is not
#  "done" -- nothing was settled -- and not "backlog" -- it is not waiting to
#  start. B10 is the first.

[meta]
project   = "vivarium"
question  = "Does an agent that can alter itself while working, and keep what worked, become measurably better over time?"
updated   = "2026-08-11"
source    = "HANDOFF.md is the prose; this file is the order of work."
sizing    = "size, not due dates: an experiment's length is unknown until its instrument exists. Time-box at sprint planning instead."

# COURSE CORRECTION 2026-08-11, and the reason the question above was rewritten.
#
# The old question -- "what does a harness gain when the agent's world is a
# running image?" -- is a question about SELF-MODIFICATION. It is the mechanism
# and not the objective, and five consecutive stories answered variants of it:
# can code change (B7), can state survive (B7, B10, B11), can changes be
# reverted (B12), can processes be replaced and faults contained (B8). All
# useful. None of them measures whether the agent GOT BETTER.
#
# THE DRIFT IS VISIBLE IN THIS FILE. S6, S7, S8 and S9 are the improvement
# stories and have been "blocked" throughout, while B7 -> B10 -> B11 -> B12 -> B8
# all ran past them.
#
# IT IS ALSO STRUCTURAL IN THE INSTRUMENT, which is the more serious half. Every
# task in the set is scored INDEPENDENTLY, in a fresh package, from a fresh
# checkpoint. There is no experiment here in which something the agent did in
# task N could affect its score in task N+1. Self-improvement is a BETWEEN-
# EPISODE property and every instrument built so far is single-episode. The
# measurement is not weak; it is structurally incapable.
#
# T9 and T10 are the closest thing to an exception and their own family header
# already states the limit: they check that a tool schema COULD be derived from
# what the agent installed, not that the agent registered it, called it, and was
# better off for it afterwards.
#
# THE SUBSTRATE WORK IS NOT DISCARDED -- it is demoted to supporting machinery
# and it calibrated the comparison that now matters. B11 priced the restart that
# artifact-based evolution requires at ~3,000 tokens, positive in 31 of 34 pairs,
# which is the handicap the externalised arm has to overcome. B7 and B12 supply
# the live arm's install semantics. B12 and B8 established that no runtime
# verifies the component's own account of itself, which is why the ledger stays.

# The spine. Sprints are slices of this, in order.
journey = [
  "1. a question with kill criteria                 -- done",
  "2. a harness that can act in the world           -- done",
  "3. an instrument that measures outcomes          -- done, S1, SINGLE-EPISODE",
  "4. a control honest enough to compare against    -- next, S5",
  "5. verdicts on the cheap experiments             -- next, S3 and S4",
  "6. an instrument that measures ACROSS episodes   -- B14, the precondition",
  "7. does self-modification produce improvement?   -- B15, the objective",
  "8. evidence the result survives outside the lab  -- blocked on 7",
]

