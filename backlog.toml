as_a     = "researcher"
i_want   = "a conflict census over candidates that touch different definitions"
so_that  = "I know whether per-definition merge is genuinely free or whether the git systems' merge layer was load-bearing"
notes    = """
The docs explain the missing verdict as 'the search converges before complementary
specialists appear'. The real reason is structural and worse: experiments/e2-selection.lisp
gives every candidate exactly one definition, always the same target --

    :definitions (list (cons \"DEFUN KNOBS::KNOB\" ...))

A genome of size one cannot produce a complementary pair or a merge conflict that
means anything. merge-candidates can never union two disjoint definition sets
because there are none. Claim 1 is not unmeasured on that landscape, it is
unmeasurable, and no budget fixes it. This is why S1's acceptance criteria demand
multi-definition candidates.

The machinery is already built and tested: conflicts-between, merge-candidates,
complementary-pair. T12 now supplies the shape they need, and the clean-merge
half is already demonstrated -- two lineages fixing different definitions, each
leading a different case, conflicts-between empty, merge carrying both and
scoring both. What remains is the census at scale, and the conflict half via T11.
"""
acceptance = [
  "a landscape where two lineages genuinely specialise on different definitions",
  "the census reports a real count of pairs, not zero-for-lack-of-pairs",
  "a stated rate: how often do two winners touch the same definition with neither body subsuming the other",
  "verdict written into docs/e2-archive-tree.md",
]
tasks = [
  "build the landscape from S1's multi-definition tasks",
  "run experiments/e2-merge.lisp against it",
]
kills_it = "Two winners routinely touch the same definition with neither subsuming the other. Then merging is not free and the textual-merge layer was doing real work."

