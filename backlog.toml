SCORE FIRST, against SHAM: FULL +0.016, DISTILLED -0.010, LEDGER -0.057. No arm
loses enough to end the experiment, so efficiency is meaningful. LEDGER's
-0.057 is small but one-sided -- worse in six pairs, better in one.

THE FINDING IS THE DECOMPOSITION, not "ledger beats transcript":

  dropping the transcript saves     ~2,400 tokens   LEDGER - SHAM,  25/34
  the restart it requires costs     ~3,000 tokens   SHAM   - FULL,  31/34
                                    -------------
  net against just continuing         ~+600 tokens  LEDGER - FULL,  22/34

COMPRESSION GENUINELY WORKS. THE RESTART IT REQUIRES COSTS MORE THAN THE
COMPRESSION SAVES. So the operational rule is: do not restart in order to
compress; if a restart is happening anyway, reconstruct from the ledger rather
than replaying the full transcript. That is a harness decision available today.

THE PRE-REGISTERED PREDICTION IS DISCONFIRMED, 3 clauses of 4. DIST < SHAM
fails (+1,698), DIST < FULL fails (+4,687), DIST >= SHAM on score fails
(-0.010); only DIST > LEDGER on score holds (+0.047). Distillation is WORSE
than the raw transcript it replaces, at 6.18 turns against FULL's 2.68, with
the summariser's own call charged to it -- which is why it was charged.

THE FOUR-ARM DESIGN PAID FOR ITSELF: the ~3,000-token restart cost is exactly
what three arms would have buried inside "ledger restart is cheaper".

B10's OBSERVATION WAS A PROPERTY OF FAMILY D. LEDGER - FULL is -2,229 on family
D, where B10 measured it (cheaper in 7/10), and +1,774 on the five tasks
outside it (cheaper in only 5/24). It replicates exactly where B10 looked and
reverses everywhere else -- the mirror-image failure this story was written to
catch, now measured rather than feared.

GENERALISATION GATE PASSES, NARROWLY: keeping the transcript beat dropping it
in 4 of 34 pairs, T18 (3/5) and T11 (1/5). The broad claim is not forbidden. It
is also not comfortable -- on five of seven tasks the transcript never once
earned its place.

SCOPE, and this bounds the claim: ONE FROZEN SUMMARISER. A single prompt, one
call, untuned by construction. This is a result about THAT distillation, not
about distillation. FROZEN -- do not tune the summariser until it wins and keep
calling the result B11; a better-targeted summariser is a different experiment
and its honest form pre-registers the prompt again.

WHAT IT DOES NOT ESTABLISH, stated because the temptation is to over-read it.
Not "the ledger is sufficient cognition" -- FULL still wins sometimes and
LEDGER loses slightly on aggregate score. Not that full computational
continuation is unnecessary; B11 never tested continuation. What survives is a
layered model: ledger AUTHORITATIVE, transcript EPHEMERAL working cognition,
runtime continuation NOT SHOWN NECESSARY. So B7's capability still has no
workload-level reason to migrate, B8 stays live because explicit state has not
been shown inadequate, and B12 is untouched -- B11 says nothing about clean
removal of promoted changes.

THE COUPLING B11 EXPOSED, filed as B13 and deliberately NOT run now:
compression and restart were coupled by the MECHANISM, not by necessity.
"""
acceptance = [
  "three arms over a task set chosen for this question, not inherited from B10, with score reported before efficiency",
  "the B10 observation reproduced or not reproduced on the original family D tasks, stated either way",
  "at least one task where carrying the transcript demonstrably helps, or a written argument that none exists -- otherwise the result is about the tasks",
  "spread reported, never a bare mean: S2c measured 24% cell disagreement at temperature 0",
]
kills_it = "Distillation and ledger restart match full transcript on score and cost, or the effect only appears on family D. Then B10 stage 1 saw a property of three tasks rather than of agentic repair, and there is nothing to bank."

[[story]]
id       = "B12"
sprint   = 0
title    = "Cordis probe: how does an accepted mutation leave the organism?"
labels   = ["backlog", "spike", "external"]
status   = "done"
size     = "M"
depends_on = []
as_a     = "researcher"
i_want   = "one complete mutation lifecycle run through an existing reversible-effects runtime"
so_that  = "the half of self-evolution vivarium has never modelled is measured against something that already does it"
notes = """
PROVENANCE DISCHARGED 2026-08-11. The paper was read (Shi, Zhang, Cui, "A
Programming Paradigm for Spatiotemporal Composability", DeepSeek-AI / Peking
University, 88pp). The second-hand description this story was first written from
was broadly right -- revertible effects with runtime-tracked inverses (S3.1),
reactive coeffects re-evaluated as providers appear and disappear (S3.2),
observational rather than physical equivalence (S3.3.2), failed activation routed
through recovery (S4.3.4), ctx.effect as the sole mutation primitive composing
disposers LIFO (S5.1.1), transactional HMR with rollback (S5.2.2). Four things
the description did not carry, and the first changes what this story is for.

1. CORDIS TRADES COMPONENT-LOCAL STATE CONTINUITY FOR STRONG RETRACTION. S7.3,
   against DSU and Erlang/OTP: "Cordis reverts the old component's tracked
   effects and reapplies the new component's from a clean slate, so a
   component's own in-memory state does not survive a reload unless placed in a
   longer-lived dependency", and layering forward migration on top is named as
   future work. What it buys instead: no hand-written migration functions, and
   the ability to unload a component ENTIRELY and recover its resources rather
   than only update one in place.
   NOT "Cordis discards what vivarium exists to preserve" -- that was the first
   draft of this note and it mis-stated vivarium. Vivarium's identity is
   propose -> isolate -> evaluate -> select -> promote -> provenance ->
   reconcile. Preserving in-memory state is a HYPOTHESIS B7 tested and B10
   failed to show valuable on the current workload. So Cordis is not opposite to
   vivarium; it supplies a lifecycle vivarium lacks AFTER promotion.
   AND STATE IT NARROWLY: the paper shows Cordis does not currently combine
   revert-and-reapply with DSU-style forward migration and names that as future
   work. It does not show that nobody anywhere has combined reversible effects
   with state migration, and this story should not claim that.

   THE TAXONOMY THIS PRODUCES, which is the useful output even if B12 measures
   nothing else. Three runtimes answer the same question three ways:

     Cordis      v1 -> revert v1's effects -> clean boundary -> instantiate v2
                 strength: complete retraction
     OTP         v1 + S1 -> code_change -> v2 + migrate(S1)
                 strength: forward continuity
     Smalltalk   v1 + live objects, stacks, processes -> the same organism
                 continues
                 strength: captured computational continuity

   So a promoted mutation needs an explicit REPLACEMENT POLICY rather than a
   substrate choice:

     ReplacementPolicy = RevertAndReapply | MigrateState | CaptureAndContinue

   Vivarium can sit above all three and decide which change deserves to survive
   in the first place. Do not implement the abstraction yet; record it.

2. THE INVERSE IS AN AUTHOR OBLIGATION THE RUNTIME DOES NOT CHECK. S5.1.1: "that
   the inverse recovers the effect it accompanies is an obligation on the
   component author rather than a property the runtime verifies." For a
   human-authored plugin that is a discipline problem. FOR AN AGENT-AUTHORED
   COMPONENT IT IS B9's SILENT-SEMANTIC CLASS EXACTLY -- a wrong inverse produces
   a runtime that believes it has cleanly unloaded and has not. Test it directly.

3. THE PAPER NAMES THIS EXPERIMENT AS ITS OWN FUTURE WORK. S8: "a compelling
   direction for future validation is self-evolving agent harnesses... Applying
   Cordis in such a setting would validate the temporal guarantees of complete
   recovery under rapid component replacement." And S5.3's threats to validity
   call Koishi "an existence-and-adoption result rather than a quantitative one;
   measuring the abstraction's overhead... remains future work." So B12 is not
   re-treading the paper; it is doing what the paper says has not been done.

4. THE BOUNDARY IS PER-LOCATION, AND EMISSION IS OUTSIDE IT. S6.1: a location is
   inside when the system can modify it exclusively AND restore it; acquisition
   (open, malloc, fork) installs a record inside and is revertible, while
   EMISSION (write, send) "acts as id and leaves the data where other parties may
   read and write it". Recovery from an emission needs withholding (the output
   commit problem) or COMPENSATION, which is "coarser than the observational
   equivalence" -- and S6.1 is explicit that the metatheory does NOT transfer:
   commutation "has to be re-established against the coarser one".

THE GAP THIS STORY NAMES, unchanged and confirmed. vivarium models mutation
ENTERING the organism and has nothing for one leaving it:

  have:     propose -> isolate -> evaluate -> reject/promote
  missing:  promoted v17 -> runs for a while -> superseded or retracted
            -> remove exactly its contribution -> restore dependents coherently

The ledger rolls back a single definition. Nothing models a mutation that
registered a tool AND a listener AND a service AND allocated owned state, and now
has to leave without residue. E3 and E4 let an agent do exactly that.

ONE LIFECYCLE, NOT A PLUGIN BENCHMARK. Run something structurally equivalent to a
real vivarium self-edit end to end: agent notices a missing capability, proposes
component X, installs it registering a tool and a listener and a service and
allocating owned state, evaluates, promotes, operates, then replaces or retracts
it, and reconciles.

SEVEN THINGS TO MEASURE. The paper supplies the expected answer for each, which
is what makes a disagreement informative rather than a bug hunt:

  A CLEAN UNLOAD, against S3.3.2's bar and not a stricter one. Two states are
    equivalent when their COEFFECT PROJECTIONS agree -- "the part of a state that
    no key binds is thereby forgotten". Binding every shared location to a key is
    called "the paradigm's discipline and not a property of the construction", so
    state the boundary before measuring: what is allowed to be forgotten.
  B FAILED PARTIAL INSTALL. Predicted by L-Raise (S4.3.4): the fiber routes into
    Unloading carrying the error, the accumulator applies, and it arrives Inactive
    "having installed nothing". Two further predictions worth checking because
    vivarium has no equivalent: the failure is recorded PER FIBER so siblings keep
    running, and the lifecycle is NOT re-entered from an error outcome -- a failed
    component is withheld rather than retried against an unchanged environment.
  C REPLACEMENT. S6.2 distinguishes exclusive binding, which "momentarily
    perturbs every consumer's dependency", from a service broker that absorbs it.
    Which one an agent-generated replacement gets is a design choice vivarium
    would have to make too.
  D DEPENDENCY CASCADE. S5.1.3's precise claim: a provider entering UNLOADING has
    stopped providing, so dependents "recompute an unsatisfied target view and
    begin their own teardown WHILE ITS BINDINGS ARE ALL STILL IN PLACE", and the
    guard (Theorem 63) holds withdrawal back until every consumer has gone. A
    teardown needs the coeffect it is losing -- closing a connection pool hands
    connections back -- which a disposer stack alone would not order correctly.
  E WRONG INVERSE -- THE CORDIS/VIVARIUM INTERSECTION, and probably the most
    valuable case here. Author-supplied, unverified. For a human plugin that is
    a discipline problem; for an agent writing its own activate and deactivate
    it is a correctness problem, and the failure is silent:

      activate:    registerTool("search"); subscribe(listener); setPolicy(...)
      deactivate:  unregisterTool("search"); unsubscribe(listener)
                   -- setPolicy never undone

    Cordis executes that inverse perfectly and leaves the world wrong. The two
    layers compose exactly where each is strong:

      Cordis layer     "I executed every registered inverse."
      vivarium layer   "Did the resulting world MATCH the authoritative one?"

      revert(component); expected = projection(ledger)
                         actual   = introspection(runtime)
                         actual != expected  ->  FAILED REVERSION

    Structural rollback from Cordis, empirical verification from B9. Install a
    component whose inverse is subtly incomplete and ask what the runtime
    reports; expected, per S5.1.1 and S6.1, is nothing at all.
  F EFFECT CLASSIFICATION, which S6.1's acquisition/emission split implies and
    "every effect needs an undo" does not. Acquisition -- open a socket, register
    a listener, allocate, mount a tool -- sits inside the boundary and reverts.
    Emission -- send a packet, publish, charge an account -- crosses out and
    needs withholding or compensation. For an autonomous agent that is three
    classes, not one:

      Revertible     undo restores observational state    scratch file, tool
      Compensatable  history stands, semantics restored   notification, charge
      Irreversible   needs approval or a commit barrier   publishing a secret

    Measure which class each effect of the probe component falls into, and
    whether the runtime can tell them apart or the author must.

  G LEDGER RECONCILIATION. Then apply B9's rule, which Cordis does not make
    obsolete: expected = projection(ledger), actual = introspection(runtime), any
    difference is a failure. Note S6.3 supplies a genuine gift here -- because
    dependencies are DECLARED, "the complete set of proxy-mediated capabilities a
    component requires is known before it runs", which is a stronger pre-install
    review surface than vivarium currently has.

AMENDED 2026-08-11, AFTER B11 CLOSED. Two changes, neither cosmetic.

WHICH CASES ARE LOAD-BEARING. Seven cases is a description of the surface, not a
plan for what to do when the probe runs long. Four carry the result:

  B  FAILED PARTIAL INSTALL   do already-installed effects actually disappear
  D  DEPENDENCY WITHDRAWAL    is this more than a disposer stack
  E  WRONG INVERSE            Cordis says clean, reconciliation says otherwise
  A + C  CLEAN UNLOAD AND REPLACEMENT   the CONTROLS -- without them B, D and E
         have no baseline and a failure cannot be told from a probe that never
         worked

F (effect classification) and G (ledger reconciliation) are recorded from what
the other five produce; they do not need their own runs. If time is short, A, B,
C, D, E is the set.

MEASURE CORDIS AS IT EXISTS. Do not improve it with vivarium ideas on the first
pass, and do not go looking for the intersection before the boundary is located.
The order is:

  1. establish where the ACTUAL Cordis boundary lies -- what it retracts, what
     it leaves, what it reports, on B, D and the two controls
  2. ONLY THEN case E, where the incomplete inverse can show whether
     CORDIS + RECONCILIATION is stronger than either layer alone

Backwards, E measures a strawman: layering B9's reconciliation on a runtime
whose own guarantees have not been characterised produces a finding about
vivarium's checker, not about the composition. The composition claim needs both
halves measured separately first.

THE CONCEPT THIS SHOULD PRODUCE, whatever the measurements say:

  PROPOSE -> ISOLATE -> EVALUATE -> PROMOTE -> ACTIVATE -> OPERATE
          -> SUPERSEDE/RETRACT -> DEACTIVATE -> RECONCILE

B12 enters that lifecycle at SUPERSEDE/RETRACT. Everything left of it exists in
vivarium already; nothing right of it does.

DO NOT IMPLEMENT CORDIS SEMANTICS IN SBCL YET. Probe first, then extract only
what measurement justifies -- plausibly no more than

  ComponentMutation { requires, provides, activate() -> EffectSet }
  Effect { contribution, inverse }

and NOT the calculus, the coeffect algebra, isolation realms, interception, the
configuration loader or the HMR engine. Reproducing those turns a useful harness
into a framework rewrite.

SEQUENCING: runs BEFORE B8 and sharpens it. BEAM contains EXECUTION failure -- a
process dies, a supervisor replaces it. Cordis contains EFFECT ownership -- a
component departs and its contributions are withdrawn. S6.3 settles that these do
not substitute for each other: language-level mediation "is insufficient" for
untrusted code because "a malicious component with access to the host runtime can
reach the underlying objects directly", and strong isolation still needs a
process, runtime or container boundary. A self-evolving system plausibly needs
both, which is a better question than whether Elixir beats Lisp.

---------------------------------------------------------------------------
RESULT 2026-08-11, docs/cordis-probe.md, probe at docs/probes/cordis/.
cordis 4.0.0-rc.8 from npm (cordiverse/cordis) on Node 24.13.0. Eight cases,
deterministic, byte-identical across runs. Every paper claim tested was
verified against the PDF BEFORE the probe was written -- L-Raise p38, the
author obligation p56, Theorem 63 pp34-35, the broker split p68, the
coeffect-projection boundary p23 -- and all five hold verbatim.

STAGE 1, CORDIS ALONE. The controls pass: clean unload leaves no residue inside
the declared boundary and the registry goes 1 -> 0. Partial activation failure
confirms all four L-Raise predictions, including the two vivarium would not have
thought to build -- failure is recorded PER FIBER so siblings keep running, and
the lifecycle is NOT re-entered from an error outcome, so a failed component is
withheld rather than retried. Replacement costs one forced consumer reload under
exclusive binding and zero behind a broker.

DEPENDENCY WITHDRAWAL IS MORE THAN A DISPOSER STACK, and the discriminating
control is what shows it. Registering the provision LAST makes pure LIFO revert
it FIRST; the trace is BYTE-IDENTICAL to registering it first, and in both the
consumer's teardown resolves the binding and hands its connections back. The
ordering came from Theorem 63's guard. Two further behaviours vivarium lacks: a
consumer lands in PENDING rather than DISPOSED, and re-providing the key
reactivates it unaided.

THE GUARANTEE IS CONDITIONAL, and sharply. p35 says the guard orders along
COEFFECTS and not along the fiber tree. Measured: the same dependency expressed
as a parent-held resource the child closes over gets NO ordering -- the parent's
inverse ran first and the child's teardown saw it closed. An agent will reach for
whichever is convenient and only one of the two is protected.

STATE CONTINUITY, S7.3 confirmed: component-local state does not survive
replacement (v2 rebuilds the whole index); the same state in a longer-lived
dependency survives at zero cost. The escape hatch is one indirection. Read as a
rule -- state that must cross a version boundary must be NAMED AS A DEPENDENCY
rather than held -- which is the same shape B11 reached from the other side.

STAGE 2, THE INTERSECTION, and this is the result. Four variants of one
capability through the full lifecycle:

                        getEffects matches   CORDIS       RECONCILIATION
  faithful              yes                  clean        matches ledger
  incomplete inverse    yes                  clean        FAILED REVERSION
  out of band           no                   clean        FAILED REVERSION
  disguised             yes                  clean        FAILED REVERSION

CORDIS REPORTS A CLEAN UNLOAD FOR ALL FOUR -- DISPOSED, no error, no retained
effects. It is right to: it executed every inverse it was given. Whether the
world now matches the history is a question it does not ask.

And the pre-unload check is worth less than it looks. Cordis's introspection can
see the out-of-band mutation while the component is active (2 tracked effects vs
5), so a declared-vs-tracked check catches OMISSION. But EffectMeta carries
{label, children} and the label is a free string the author passes, so the
DISGUISED variant -- a no-op registered under the missing label -- is
indistinguishable from faithful on that surface, and the INCOMPLETE INVERSE never
was distinguishable there at all. Reconciliation catches all three; nothing else
catches more than one. Not a Cordis defect: it never claims getEffects witnesses
anything. It bounds what a pre-unload check can be worth, which vivarium needed
to know before building one.

ISOLATION, measured not assumed: ctx.isolate isolates the realm a coeffect KEY
resolves in; a component reached ambient state straight through it. That is S6.3
as written, and it is what SEPARATES B12 from B8 rather than an argument for it.

RECOMMENDATION: adopt the contract, keep reconciliation, do not adopt Cordis.
Take ComponentMutation/Effect plus four behaviours -- the guard, per-component
terminal failure, consumers as standing declarations, and dependencies-not-held
state. Do not take the calculus, coeffect algebra, realms, interception, the
config loader, the HMR engine or the broker. Do NOT take parent/child as an
ordering primitive: it is the one shape that looks protected and is not.
"""
acceptance = [
  "one complete lifecycle run end to end -- propose, install, evaluate, promote, replace or retract, reconcile -- on something shaped like a real vivarium self-edit, not a synthetic plugin",
  "all seven cases measured, with B (failed partial install) and E (wrong inverse) reported whatever they show, since those are the two vivarium has no answer for",
  "the observational boundary stated BEFORE measuring: which locations are bound to keys, and therefore what 'as if it never existed' is allowed to forget",
  "the in-memory-state question answered for vivarium's case: Cordis reverts and reapplies from a clean slate, so state a promoted mutation accumulated does not survive its own replacement unless it was placed in a longer-lived dependency -- measure what that costs a harness whose whole premise is accumulated live state",
  "the minimal semantics vivarium would need extracted as a contract, with everything deliberately NOT taken listed and why",
]
kills_it = "Clean unload holds only for components that own nothing but their own registrations, or the in-memory-state loss on reload costs more than the unload machinery saves for a harness built on accumulated live state. Then effect containment is not the primitive vivarium is missing, the gap closes with a rollback that walks the ledger backwards, and B8 keeps its original framing."



[[story]]
id       = "B9"
sprint   = 0
title    = "Mutation observability: every self-modification becomes evidence"
labels   = ["backlog", "invariant", "safety"]
status   = "backlog"
depends_on = []
size     = "M"
as_a     = "researcher"
i_want   = "one transactional write path for every persistent self-modification, and a metric for what escapes it"
so_that  = "an agent that changes itself incorrectly produces evidence rather than a silently wrong world"
notes = """
GENERALISED OUT OF B7, where it showed up twice on Smalltalk and turned out not to
be a Smalltalk property at all.

B7's M5 sorted runtime failures into three classes, and the third is the one that
matters for a self-improving system:

  BLOCKING          author-initials dialog -- agent freezes, nothing to catch
  EXPLICIT          SyntaxErrorNotification, ConnectionRefused -- agent recovers
  SILENT SEMANTIC   undeclared variable accepted; port bound twice -- THE AGENT
                    BELIEVES THE CHANGE SUCCEEDED AND CORRUPTS ITSELF

Blocking is loud and was fixed by one message send. Silent semantic failure is the
dangerous one, and B7's M3 found the same defect in another place: a method
installed outside the ledger path still runs, but reports its arguments as
(arg1, arg2) with no description, and NOTHING REPORTS THE NAMES MISSING.

So the framing is not "Smalltalk reflection is deficient". It is WRITE-PATH
INTEGRITY, and the invariant is substrate-independent:

  every persistent self-modification
                |
          mutation transaction
                |
    source -- provenance -- candidate
                |
             compile
                |
             validate
                |
             evaluate
                |
             promote

Anything bypassing that path is unsafe in any language. Direct compile: -- or its
Lisp equivalent -- becomes analogous to writing into a database's storage files:
technically possible, architecturally forbidden.

THE BROADER POINT, and the reason this is its own story rather than a note in B7:
THE DANGEROUS OPERATION IS NOT CODE GENERATION, IT IS UNOBSERVED STATE TRANSITION.
The write path has to cover all of it --

  code modification          memory modification
  schema changes             learned policy changes
  tool registration          prompt modification
  capability installation

-- which is a bigger surface than the ledger currently guards, and every item on
it is something E3/E4 lets an agent do at runtime.

TWO HALVES, AND ONLY THE FIRST IS OBVIOUS. A closed write path does not by itself
make the ledger authoritative:

  authoritative = every durable transition passes through the ledger
                + RUNTIME STATE CAN BE RECONCILED AGAINST IT

The second half is what catches the bypass path that the first half failed to
close, and it is executable rather than aspirational:

  expected = projection(ledger)
  actual   = introspection(live system)
  divergence = actual - expected

DIVERGENCE IS A FIRST-CLASS FAILURE, NOT A LOG LINE. A non-zero divergence fails
the run the way a failing test does -- otherwise it becomes a warning nobody
reads, which is the same silent-semantic failure mode this story exists to
remove, relocated one level up. Without this half, "the ledger is authoritative"
is a claim about intent rather than a property of the running system.

METRIC: MUTATION OBSERVABILITY -- when the agent changes itself incorrectly, how
reliably does the substrate turn that mistake into observable evidence? Neither
SBCL nor Smalltalk has been measured on it. B7 measured 15 operations on one
dialect and found one blocking and two silent-semantic failures; that method
generalises directly.

B9 MAY BE THE BRIDGE, noted when B12 was filed. Cordis routes every context
mutation through one effect primitive; vivarium routes every durable mutation
through one ledger and additionally demands the runtime reconcile against it.
Composed, that is a shape worth building rather than two competing ones:

  evolution ledger (authoritative intent)
        -> component mutation
        -> tracked effects
        -> live runtime
        -> introspection
        -> reconcile back to the ledger

Note which half is vivarium's: the reconciliation arrow. An effect system tracks
what it was asked to do; it does not check the running world still agrees.

WHY IT IS NOT BLOCKED ON THE SUBSTRATE QUESTION: this is worth doing on SBCL now,
whatever B8 decides. If B8 sends the project to Smalltalk the invariant is needed
MORE, because M3 showed the image's own account of itself degrades off the ledger
path.
"""
acceptance = [
  "an enumeration of every runtime path by which vivarium's agent can persistently change its own world, and which of them currently bypass the ledger",
  "the ledger made the only sanctioned write path for the ones that matter, with the bypass either closed or made loud",
  "a mutation-observability score for SBCL: for each mutation class, does an incorrect change produce blocking, explicit, or silent-semantic failure",
  "the silent-semantic cases converted to explicit ones, or a written argument for why a given one cannot be",
  "a reconciliation check -- expected = projection(ledger), actual = introspection(live system) -- wired so that non-zero divergence FAILS the run rather than logging a warning",
]
kills_it = "Every mutation path already produces explicit evidence and nothing silent-semantic is found on SBCL. Then the invariant is already enforced in practice, the metric measures nothing, and this collapses back into a footnote on B7."



[[story]]
id       = "B8"
sprint   = 0
title    = "BEAM probe: does supervision beat fork for containing a bad mutation?"
labels   = ["backlog", "spike", "risk"]
status   = "done"
size     = "M"
depends_on = []
as_a     = "researcher"
i_want   = "three measurements on Erlang/Elixir, against SBCL numbers that already exist"
so_that  = "the strongest argument against this substrate is tested rather than admired"
notes = """
SPINOFF, sibling to B7. A PROPERTY PROBE, NOT A TASK-SET PORT.

The case for BEAM is real and was under-weighted: self-improvement's
characteristic failure mode is that a component eventually emits bad code, and
OTP is the runtime built around exactly that. Hot code loading keeps two module
versions live and code_change/3 migrates state -- both parts of the execution
model rather than bolted on.

WHY NOT "THE SAME TASKS ON ALL THREE". The task set is Lisp-specific BY
CONSTRUCTION: T3 is update-instance-for-redefined-class, T8 is closures over
runtime values, T16 turns on REMOVE-DUPLICATES defaulting to EQL, T17 is the
ledger's introspection fallback. Porting them produces ANALOGOUS tasks, and then
two different benchmarks get compared and called a substrate result. That is the
confound harness-lineage.md already warns about -- "do not compare file-Pi
against image-single-tool" -- at larger scale.

THREE QUESTIONS, each with an SBCL number already measured to compare against:

Read them as THREE INCREASINGLY DEEP BOUNDARIES, not three unrelated benchmarks.

  1. THE FAULT BOUNDARY. Have an agent install code that wrecks the runtime.
     Does only the process die, or the node? SBCL's fork contains ANY child
     failure by construction (E1: a child that corrupts its heap cannot touch
     the parent) at 28-32ms per trial. BEAM process isolation is INTRA-VM and
     may be weaker for this specific failure, which is the opposite of the
     conventional reading. Pick failures that deliberately cross different
     boundaries, so "let it crash" is measured rather than recited:

       ordinary exception      should be process-local
       infinite Erlang loop    the scheduler should cope (reductions preempt)
       atom-table exhaustion   VM-GLOBAL
       code-server corruption  VM-global-ish
       blocking or bad NIF     can take the scheduler, and the node, with it

     The gradient is the result. A substrate that contains the first two and
     nothing else is telling you where its real boundary is.

  2. MUTATION IMPEDANCE -- the highest-value axis, because it is on the HOT PATH.
     Measure the WHOLE MUTATION TRANSACTION, not "Lisp forms versus Erlang
     tuples":

       propose -> representation -> parse -> transform -> compile -> load ->
       locate the affected process -> activate the new behaviour -> inspect

     Two outcomes would each be worth knowing and they point opposite ways:
       (a) Erlang's non-homoiconicity is architecturally ugly but barely matters,
           because the model writes SOURCE TEXT either way and the abstract
           format never reaches the LLM;
       (b) SBCL's structural representation materially reduces errors when the
           agent is TRANSFORMING AN EXISTING PROGRAM rather than generating a
           function from scratch.
     So separate the two workloads and score them apart. Generation and
     transformation are different jobs and vivarium does both; a single
     "code-gen impedance" number would average them into noise.

  3. STATEFUL REPLACEMENT -- and split it in two, because only the second half is
     where BEAM's model is genuinely different:

       MODULE REPLACEMENT         v1 -> load v2
       PROCESS-STATE MIGRATION    code_change(oldVsn, state, extra)

     The interesting experiment is not loading v2. It is an agent process holding
     current_goal, candidates, evidence, partial_result, GENERATING ITS OWN v2,
     and migrating its state representation through code_change/3 without dying.
     That is close to Smalltalk's live evolution, except BEAM deliberately keeps
     code and process state separate -- which is the whole comparison.

     CAVEAT THAT DECIDES WHETHER THIS AXIS MEASURES ANYTHING: OTP HOT UPGRADE IS
     NOT ARBITRARY SELF-MODIFICATION. code_change/3 is a controlled migration
     hook inside a release upgrade, with old/new module coexistence supplied by
     the runtime. Vivarium's agent does something more aggressive: observe
     failure -> invent code -> compile candidate -> install -> evaluate ->
     possibly replace itself again, repeatedly, with no release engineer in the
     loop. This probe must not accidentally prove "OTP release upgrades work"
     when the question is "does BEAM make REPEATED AGENT-GENERATED MUTATION
     better". Design the runs so the agent, not a release script, drives every
     upgrade -- which is also why axis 2 carries more weight than this one.

WEIGHTING, if the probe has to be cut short: AXIS 2 CARRIES THE MOST INFORMATION.
Code generation sits on the agent's HOT PATH -- it happens every single turn --
whereas supervision only matters when something has already gone wrong. A
substrate weakness on the hot path compounds; one on the failure path is
amortised over how rarely it fires.

DO NOT MEASURE: throughput, distribution, syntax. E1 already showed parallel
fan-out barely beats sequential (28.3 vs 31.8ms), so distribution is a
capability with no demonstrated requirement here.

THE DEEPER POINT, which belongs in HANDOFF.md rather than here: the three
substrates encode three DIFFERENT DEFINITIONS of self-improvement --
AMENDED after B12 was filed: THERE ARE TWO KINDS OF CONTAINMENT AND THIS STORY
ONLY ASKED ABOUT ONE.

  EXECUTION CONTAINMENT   bad process -> process dies -> siblings and node
                          continue.                              BEAM's answer.
  EFFECT CONTAINMENT      bad or departing component -> its contributions are
                          withdrawn -> dependents react.         Cordis's answer.

A self-evolving system plausibly needs both, and that is a better question than
whether Elixir beats Lisp. A supervisor restarting a process does not withdraw
what the dead process registered elsewhere; withdrawing effects does not stop a
NIF wedging the scheduler. Run B12 first -- it gives this story a comparator it
does not currently have, and axis 1 below should then be read as measuring the
EXECUTION half specifically rather than containment in general.

CONFIRMED FROM THE CORDIS PAPER (S6.3), which settles that the two do not
substitute for each other: language-level component mediation "is insufficient"
for untrusted code, because "a malicious component with access to the host
runtime can reach the underlying objects directly, rendering such checks moot",
and strong isolation still requires "a sandboxed process, or a virtualized
container". So effect containment cannot subsume execution containment. Whether
the converse holds is this story's axis 3 restated: OTP migrates process state
FORWARD through code_change/3, where Cordis reverts and reapplies from a clean
slate -- the paper (S7.3) grants that forward migration handles in-memory state
"more gracefully" and calls layering it onto revertible effects future work. So
axis 3 is now a three-way comparison and vivarium wants the property BOTH of
them only half-supply: state that survives the change AND effects that leave
cleanly.

  SBCL      the agent is a program that rewrites programs
            -> does homoiconicity reduce self-improvement impedance?
  Smalltalk the agent is a computational organism that persists
            -> does preserving computation itself improve outcomes?
  BEAM      the agent is a society that survives by replacing members
            -> if cognition is explicit state, does supervised evolution make
               the system safer or better?
The headline question presupposes the first two. Erlang's framing is not another
implementation of it; it is another question. That choice has never been made
explicitly and should be.

Asymmetry worth keeping in view when reading the result: supervision, isolation,
restart and versioning are PATTERNS you can build -- this project already has
fork isolation, a ledger, and rollback. Homoiconicity is not obtainable as a
library.

FOURTH QUESTION, added after B7 finished and B10 was written. The three above are
PROPERTY questions. B7 turned the substrate argument into a PERSISTENCE question,
and BEAM answers it a third way:

  SBCL       explicit data + restart          the agent is a program that
                                              rewrites programs
  Smalltalk  capture live computation         the agent is a computational
                                              organism that persists
  BEAM       replace disposable processes     the agent is a society that
             from durable state               survives by replacing members

  process dies -> durable state survives elsewhere -> supervisor starts a
  replacement -> the new process continues FROM EXPLICIT STATE.

So BEAM is not a fourth arm of B10. But state the proof it actually supplies
precisely, because the first draft of this note over-claimed it and contradicted
something B6 already recorded:

  BEAM IS AN INDUSTRIAL EXISTENCE PROOF OF SUPERVISED REPLACEMENT AROUND EXPLICIT
  STATE -- NOT OF DURABLE STATE ITSELF.

A gen_server owns its state, a supervisor restarts the process, and code_change/3
transforms that state across a release upgrade. None of that survives NODE DEATH:
process state is volatile, the supervision tree recreates children from scratch,
and durability requires Mnesia, DETS or another external store. B6 says exactly
this -- Erlang pushes durability OUTSIDE the VM and pairs it with let-it-crash.
So BEAM supplies the REPLACEMENT half of arm A2 as a runtime primitive and leaves
the DURABLE half where vivarium already has it, in the ledger.

THE TWO STORIES ASK DIFFERENT QUESTIONS, which is why neither subsumes the other:
  B10  what does externalising cognition into data COST?
  B8   IF explicit state is sufficient, is BEAM a better substrate for running a
       self-improving system, because process replacement, supervision and hot
       upgrade are native runtime mechanisms rather than harness code?

B10 WAS MEANT TO SEQUENCE THIS STORY and could not: it halted without
identifying the effect, so neither "A2 ~= B" nor "B >> A2" was established. That
does not block B8 -- it removes a comparator. Nothing here now rests on captured
computation having been shown better or worse than explicit state, and no claim
in this probe may assume either.

---------------------------------------------------------------------------
AMENDED 2026-08-11, AFTER B12 CLOSED. B12 answered effect containment strongly
and left execution containment untouched, which sharpens all three axes from
descriptions into comparisons against a measured baseline:

  AXIS 1  EXECUTION CONTAINMENT   Cordis provably cannot supply it. Measured,
          not quoted: ctx.isolate isolates the realm a coeffect KEY resolves in,
          and a probe component reached ambient state straight through it. So
          axis 1 is the only place this property can come from, and the fault
          gradient is the whole result.

  AXIS 2  MUTATION IMPEDANCE      SBCL code-as-data against Erlang's source /
          abstract-format / tooling path. Unchanged by B12 and still the
          highest-value axis, because it sits on the hot path.

  AXIS 3  STATEFUL REPLACEMENT    now a real comparison rather than a
          description, because both sides have measured semantics:

            Cordis  RevertAndReapply   old state DISCARDED, effects withdrawn,
                    new component reapplied from a clean boundary
            OTP     MigrateState       old process state -> code_change/3 ->
                    transformed new state

          B12 measured what the first costs: component-local state does not
          survive replacement and rebuilds from nothing, while the SAME state
          placed one indirection away in a longer-lived dependency survives at
          zero cost. So axis 3's question is no longer "does hot upgrade work".
          It is:

            DOES FORWARD MIGRATION BUY ENOUGH OVER EXPLICIT EXTERNALISED STATE
            PLUS CLEAN RETRACTION TO JUSTIFY ITS COMPLEXITY?

          That is answerable, and a negative answer is as useful as a positive
          one: it would say the externalisation rule B11 and B12 converged on is
          sufficient and code_change/3 is machinery vivarium does not need.

DO NOT RE-ESTABLISH THE THIRD POLICY. CaptureAndContinue was measured in B7 and
that cell is filled. B8 does not implement Smalltalk again.

DO NOT LET AXIS 3 BECOME AN OTP RELEASE-UPGRADE DEMO. The caveat above stands and
B12 makes it sharper: the agent drives every upgrade, and the comparator is
vivarium's own externalised state, not a release script.

---------------------------------------------------------------------------
RESULT 2026-08-11, docs/beam-probe.md, probes at docs/probes/beam/.
Erlang/OTP 29 (erts 17.0.3), Elixir 1.20.2, macOS arm64. No task-set port.

AXIS 1, THE FAULT GRADIENT, and it went worst -- which matters because
containment is the reason anyone reaches for BEAM. Instrument is a supervised
BYSTANDER ticking every 10ms to a file, so its progress is readable even when the
node dies without reporting. Baseline ~110 ticks.

  CONTAINED   ordinary exception            108 ticks, victim restarted once
              runaway Erlang loop           110 ticks, reduction counting
                                            preempts it -- SBCL has no equivalent
              heap alloc + max_heap_size     106 ticks, killed on first chunk
  NOT         binary alloc, no cap           3.25 GB unopposed
  NOT         binary alloc + max_heap_size   4.29 GB -- THE CAP NEVER FIRED
  NOT         code server killed             node dead in 0.95s
  NOT         atom exhaustion                node dead in 0.53s
  NOT         non-yielding NIF               WEDGED, and IGNORED SIGTERM
  PARTLY      the same NIF on DIRTY schedulers  survived at 58/110 ticks

Against E1's baseline, SBCL's fork contains all ten by construction because the
child is a separate OS process. BEAM contains three outright.

TWO CORRECTIONS THE PROBE FORCED ON ITSELF, both worth keeping because the first
reading was wrong in each. (1) max_heap_size bounds the process HEAP and binaries
over 64 bytes are refc-allocated OUTSIDE it, so BEAM's only per-process memory
ceiling does not bound the allocation an agent is most likely to make; the three
memory arms separate this cleanly. (2) An earlier victim re-crashed on every
restart, exhausted the supervisor's intensity limit within a second and reported
"node died" for a fault that was perfectly contained. The fault now fires ONCE.

THE UNKILLABLE NODE IS MEASURED, NOT INFERRED: a node with every scheduler in
native code survived SIGTERM and ran 4m43s against a 15s limit, then died
instantly on SIGKILL. The driver records this as exit 137 against 124.

AXIS 2, MUTATION IMPEDANCE. Generation costs nothing -- the agent writes SOURCE
TEXT, three library calls install it, the abstract format never reaches it, which
is the story's outcome (a) confirmed structurally. Transformation is lossy:
without debug_info NOTHING is recoverable from the runtime, and with it the agent
gets the ABSTRACT FORMAT -- transformable and reprintable, but not what it wrote.
STATED AS NARROWLY AS MEASURED: this is availability and fidelity. Outcome (b),
that structural representation reduces agent ERRORS on transformation, is NOT
tested -- it needs the harness pointed at both substrates on matched tasks, which
this story's own acceptance criterion forbids porting to get. Real open gap.

AXIS 3, STATEFUL REPLACEMENT, and this is the strongest result. Agent-driven
throughout: module source generated as text at runtime, compiled, loaded, and
migrated through sys:suspend/change_code/resume -- no release script.

                       steps  identity   serves  runtime said  reconciliation
  migrate correct        7    preserved   yes      nothing      matches
  migrate WRONG          7    preserved   yes      NOTHING      FAILED
  externalise correct    8    replaced    yes      nothing      matches
  externalise WRONG      8    replaced    yes      NOTHING      FAILED

OTP TRUSTS code_change/3 EXACTLY AS CORDIS TRUSTS THE INVERSE. Two runtimes with
nothing in common, same silent failure, and only the ledger comparison catches
it. So the B12 gap is not a property of Cordis: it belongs to every runtime that
delegates its own transition to the component being replaced, and reconciliation
is substrate-independent.

ANSWER TO THE AXIS: NO. Forward migration costs one step fewer and preserves
process identity -- worth something where identity is load-bearing -- and buys
NOTHING on correctness while requiring a bespoke transformation function per
shape change. The externalised arm is the route B11+B12 already implied.

RECOMMENDATION: do not switch. Take two things anyway -- reduction counting is a
real property SBCL lacks (an argument for keeping trials forked, not for
switching), and one_for_one restart-the-child-leave-the-siblings is worth copying
at harness level, which is B12's per-component terminal failure reached
independently by a second runtime.
"""
acceptance = [
  "the fault gradient measured, not a verdict: which of process-local exception, runaway loop, atom exhaustion, code-server corruption and bad NIF stay contained, beside SBCL fork's guarantee that all of them do",
  "mutation impedance measured over the whole transaction (propose to inspect) and scored SEPARATELY for generating new code and for transforming existing code -- one averaged number would hide the effect",
  "process-state migration driven by the AGENT rather than by a release script, so the result is about repeated self-modification and not about OTP release upgrades working",
  "a recommendation with a trigger: what result would make BEAM the right substrate",
  "no task-set port -- if the probe starts porting tasks it has become a rewrite and should stop",
]
kills_it = "Supervision does not contain a runtime-wrecking mutation any better than fork already does, and code-generation impedance is materially worse. Then BEAM's advantages are ones this project can build, and the substrate question closes."

