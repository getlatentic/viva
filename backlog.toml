[[story]]
id       = "B6"
sprint   = 0
title    = "How does a SERVING image keep its improvements?"
labels   = ["backlog", "risk"]
status   = "backlog"
size     = "L"
depends_on = []
as_a     = "researcher"
i_want   = "a way for a multi-threaded serving image to survive a restart with its accumulated state"
so_that  = "the advantage this whole project measures is not lost the moment the process exits"
notes = """
MEASURED 2026-08-11, and it is a hole in the thesis rather than a chore.

Two persistence mechanisms exist and they solve opposite halves:

  LEDGER      carries CODE across processes. Replay (target, source) into a
              fresh image and the definitions come back. Verified. Small,
              selective, and works while the image keeps serving.
              But the STATE DOES NOT CROSS -- replaying into a fresh process
              gave back the function and left *EVENTS* empty. That is exactly
              what a directory of files already gives you, so on its own the
              ledger buys nothing over the file world.

  SAVED CORE  carries EVERYTHING. Verified: definitions, 5000 accumulated
              events, and a CLOSURE over a runtime value (returned 42 from a
              captured 41) -- the one thing no source can reconstruct, and T8's
              whole premise. 58 MB, and a new process starts from it in 0.06s,
              matching E1's measured 75ms.
              But save-lisp-and-die REQUIRES A SINGLE THREAD (same constraint as
              fork) and the name is literal: IT KILLS THE PROCESS. A serving
              image cannot checkpoint itself and stay up.

So: durability and availability currently trade against each other, and the
thing the benchmark says is the image's advantage -- accumulated live state --
cannot survive a restart in the one configuration that matters, a serving image.

docs/README.md already concedes the adjacent half: "the zygote's warm state is
loaded code and fixtures, not the serving image's live sessions." This measures
what that concession costs.

SOLVED IN PRINCIPLE 2026-08-11, by asking what Smalltalk does.

Pharo has snapshot:andQuit:false -- backupImageInFileNamed: "continues
evaluation in the original image after saving". Smalltalk simply does not have
this problem, and the reason is not magic: ITS CONCURRENCY LIVES INSIDE THE
IMAGE. Processes are objects scheduled by the VM within one OS thread, so the OS
process is always single-threaded, checkpointing is always available, and
suspended Processes are saved as objects and resume on load. SBCL's threads are
OS threads, which cannot be serialised into a heap -- which is exactly why
save-lisp-and-die demands exactly one.

SBCL CAN RECONSTRUCT IT, measured:

  fork, then let the CHILD save-lisp-and-die while the PARENT continues.
  Copy-on-write gives the child the whole heap. Verified end to end --
  parent kept running with its 5000 events and its closure intact,
  child wrote a 35 MB core, whole operation 388 ms, and the restored
  core had the events, the closure (still returning 42 from a captured
  41) and the function.

CORRECTED, and the first version of this note overclaimed. A restored core
preserves DATA, not CONTROL FLOW. Measured: a snapshot taken mid-loop at step 5
restores with counter=5 and 5 steps logged -- the data as of that instant is
exact -- and then does NOT continue the loop. It starts at :toplevel. Smalltalk
resumes suspended Processes because a Process is an object in the image carrying
its own stack; SBCL has no equivalent, so anything in flight at snapshot time is
simply not in flight afterwards.

For accumulated state -- events, sessions, caches, the closures in *DEFERRED* --
this costs nothing, and it is exactly what the task set models, because E1's
no-threads constraint already forced in-flight work to be represented as DATA
rather than as running threads. For a server with requests actually in progress
it is a real loss and has to be designed around: drain before snapshot, or
accept that in-flight requests die and are retried.

So this is not a limitation of the substrate. It is a CONSTRAINT ON THE SERVER:
green threads or an event loop keeps the OS process single-threaded, and then
snapshot-while-serving is available for ~400ms. OS threads buy conventional
concurrency and cost both fork and checkpointing. E1's "SBCL refuses to fork
with more than one thread" was read as a fact forcing the zygote; it is better
read as a design choice about how the server does concurrency.

The other half is worth keeping in view, because Smalltalk pays for its
durability. Because the image persists everything forever it becomes
unreproducible and unmergeable -- image rot, "works in my image", and the whole
Monticello/Metacello/Tonel lineage exists to claw source back out into files.
THE LEDGER IS AN ANSWER TO EXACTLY THAT: per-definition records with previous
source, replayable, reviewable, merging per definition rather than per line.

PRIOR ART, checked from source and docs -- do not re-research:

  SMALLTALK (Pharo)  snapshot:andQuit:false, and it resumes MID-COMPUTATION. Concurrency is INSIDE the image:
                     Processes are objects scheduled by the VM in one OS thread,
                     so checkpointing is always available and suspended
                     processes resume on load. Durability: YES.
                     Price: the artifact is a binary heap -- image rot,
                     unreproducible, hard to diff or merge. Monticello,
                     Metacello and Tonel all exist to claw source back into
                     files.

  ERLANG/OTP         Hot code upgrade with TWO live versions of a module, and
                     code_change/3 migrating a gen_server's state in place --
                     a direct analogue of CLOS update-instance-for-redefined-class
                     and therefore of T3. Live state survives the CHANGE.
                     But the docs are explicit that PROCESS STATE DOES NOT
                     SURVIVE A NODE RESTART: it is volatile, and the supervision
                     tree recreates processes from scratch. Durability is pushed
                     OUTSIDE the VM (Mnesia, DETS, external stores) and paired
                     with let-it-crash.

So Erlang is the industrial existence proof of B6's third option -- declare live
state ephemeral and put durability elsewhere. It is a real choice, not a
cop-out, and it should be argued against rather than ignored.

DESIGN TRAP worth naming now. A core cannot be merged. If a variant became a
core rather than a set of ledger entries, E2 claim 1 dies and Smalltalk's exact
weakness comes back. Keep the two separate:
  GENOME = ledger entries -- heritable, mergeable, reviewable, tiny
  CORE   = checkpoint     -- complete, durable, unmergeable, 35-58 MB
Lineage branches the genome. A core is a restore point, orthogonal to lineage.

Neither Smalltalk nor Erlang has both halves. This project could.
"""
acceptance = [
  "a serving image that survives a restart with its accumulated state -- the fork-and-save mechanism is demonstrated, so what remains is doing it under a green-threaded server that is actually serving",
  "the cost measured: checkpoint time, core size, and whether the server stays up during it",
  "if it cannot be done, the thesis narrowed in the docs rather than left implied",
]
kills_it = "The ~400ms fork-and-save pause is unacceptable under real traffic, or a green-threaded server cannot carry the load the threaded one does. Then the trade is real and live state is ephemeral in any serving configuration."

# ===========================================================================
#  THE CENTRE, after the 2026-08-11 course correction. B14 is the instrument
#  and B15 is the experiment. Everything below them -- B7, B8, B10, B11, B12 --
#  is now SUPPORTING MACHINERY: findings that inform the implementation of these
#  two, not a roadmap of their own. No further substrate story runs until B15
#  has a result.
# ===========================================================================

[[story]]
id       = "B14"
sprint   = 0
title    = "A task sequence where a capability discovered early pays later"
labels   = ["instrument", "blocker"]
status   = "ready"
size     = "M"
depends_on = ["S1"]
as_a     = "researcher"
i_want   = "an instrument that can measure a between-episode effect at all"
so_that  = "the self-improvement question stops being unanswerable for structural reasons"
notes = """
THE PRECONDITION, and the reason B15 cannot simply be run. Every task in the
current set is scored INDEPENDENTLY, in a fresh package, from a fresh
checkpoint. Nothing the agent does in task N can reach task N+1. Self-improvement
is a between-episode property, so the existing instrument cannot measure it --
not weakly, but structurally.

WHAT IS NEEDED: a SEQUENCE with shared latent structure. Tasks 1..N drawn from
one problem family, non-identical, where a capability discovered while solving
the early ones genuinely reduces the work in the later ones. Plus a HELD-OUT
SEQUENCE from the same family that no arm has seen, to separate improvement from
memorisation of specific answers.

THE FAILURE MODE THIS STORY EXISTS TO AVOID IS B10's, TWICE OVER. B10 built
family D to be path-dependent and it was not; it then built T22/T23 for a
"search" property and the search turned out to be reading. The analogous trap
here is a sequence where the shared structure is real to the DESIGNER and
invisible to the agent, or where the repeated work is cheap enough that no tool
is worth writing. Either produces a null result that says nothing about
self-improvement.

SO THE ACCEPTANCE BAR IS A CALIBRATION, NOT A DESIGN ARGUMENT. Before any arm
runs, demonstrate on the sequence itself that:

  1. THE REPEATED WORK IS REAL. Measure the same agent, no self-modification
     allowed, across the sequence. If per-task cost does not stay flat -- if it
     falls on its own -- the sequence is teaching through the transcript and the
     later tasks are easier for a reason that has nothing to do with retention.
  2. THE CAPABILITY IS WORTH BUILDING. Hand-write the tool or skill a competent
     engineer would write, install it, and measure the later tasks with it. That
     number is the CEILING. If the hand-written ceiling is not clearly above the
     no-modification baseline, no arm can win and the sequence is not an
     instrument.
  3. IT IS NOT ONE TASK IN DISGUISE. The held-out sequence must benefit from the
     same capability. If only the training tasks improve, the capability is an
     answer key.

THE CEILING IS THE MOST IMPORTANT NUMBER HERE and it must be measured BEFORE the
arms run, so that B15 reports "the agent captured X% of an available gain"
rather than "the agent improved", which is unfalsifiable without a scale.

DOMAIN: stay in the existing live-image repair domain rather than inventing a
new one. The point is a sequence, not a new subject. A plausible shape is a
family of defects that all require locating live dependents of a definition
before the fix is safe -- work that is tedious by hand every time and mechanical
once written down.

WHAT THIS STORY DOES NOT DO: it does not let the agent modify anything. It builds
and calibrates the ruler. B15 does the experiment.
"""
acceptance = [
  "a training sequence and a held-out sequence from one family, both runnable end to end",
  "the flat baseline measured: no self-modification, per-task cost across the sequence, with spread -- and if it is not flat, the sequence is rejected and why is written down",
  "the CEILING measured with a hand-written capability installed, on both sequences, before any arm runs",
  "the gap between baseline and ceiling stated as the scale B15's result will be read against",
  "a written argument for why the shared structure is visible to the agent and not only to the designer, with the calibration numbers backing it rather than the design intent",
]
kills_it = "The hand-written ceiling is not clearly above the flat baseline, or the baseline is not flat. Then the sequence cannot measure a between-episode effect and B15 must not be run on it -- which is a real outcome and cheaper to find here than after four arms have burned a budget."

[[story]]
id       = "B15"
sprint   = 0
title    = "Live self-modification against externalised artifacts, over a sequence"
labels   = ["experiment", "headline"]
status   = "blocked"
size     = "L"
depends_on = ["B14"]
as_a     = "researcher"
i_want   = "the agent to choose how to improve itself, and the improvement measured on later tasks"
so_that  = "the project answers whether self-modification produces self-improvement, which is what it was for"
notes = """
THE OBJECTIVE. Not "can the agent change itself" -- B7, B8 and B12 answered that
from three directions -- but:

  performs tasks -> notices a recurring weakness -> changes itself ->
  future tasks use the change -> MEASURED PERFORMANCE IMPROVES ->
  the improvement persists and TRANSFERS to tasks it has not seen

FOUR ARMS, and the third and fourth are the comparison that matters:

  CONTROL      no persistent self-modification. The flat baseline from B14.
  EXTERNALISED artifacts a successor reads -- a skill file, a tool source file,
               an edited prompt. What every current coding harness does. THE
               CHANGE COSTS A RESTART.
  LIVE         compile and register into the running organism. Immediately
               usable, no restart, no artifact.
  HYBRID       mutate live, evaluate cheaply in-process, and EXTERNALISE only
               what wins. Live modification as exploration, artifacts as
               inheritance.

B11 ALREADY PRICED THE EXTERNALISED ARM'S HANDICAP: the restart it requires cost
+2,989 tokens, positive in 31 of 34 pairs. That is not a reason to expect LIVE to
win -- it is the number the externalised arm's advantages have to beat, and
having it in advance is what makes this a comparison rather than a demonstration.

FOUR SURFACES, AND THE AGENT CHOOSES:

  prompt    its own operating instructions
  skill     a reusable written procedure
  tool      a new callable primitive
  harness   the loop's own behaviour

Choosing the FORM of improvement is part of the problem and must not be taken
away by running four separate scripted experiments. "Do nothing" stays available;
an agent that correctly declines to modify itself has not failed.

START WITH TOOLS AND SKILLS. They are the cleanest test and the cheapest to
evaluate and roll back. Prompt and harness are later levels of the same ladder --
skill, tool, prompt, harness, and finally the improvement machinery itself. The
last rung is the genuinely recursive case and NOTHING HERE REQUIRES REACHING IT.

THE META-TOOLSET the agent gets, and it is small on purpose:
  inspect_self, propose_change, install_candidate, run_evaluation,
  promote_change, rollback_change

THE CENTRAL METRIC: improvement on LATER tasks attributable to RETAINED
self-generated changes, read against B14's hand-written ceiling so that a number
means something. Reported before any efficiency figure, exactly as B11 reported
score before tokens.

SECONDARY, and each is a real question:
  transfer          does the held-out sequence improve, or only the training one
  regressions       did a promoted change break something that worked
  survival          what fraction of proposed changes survived evaluation
  choice            which surface the agent picked, and whether it picked well
  IMPROVEMENT LATENCY  turns between "I need capability X" and X changing
                    behaviour. LIVE can close this within a task; EXTERNALISED
                    cannot close it before the next invocation. This is where
                    B11's restart tax is paid.

THE FRAMING THAT MAKES THE ARMS NON-EXCLUSIVE, and the reason HYBRID exists:
live state is the PHENOTYPE and external artifacts are the GENOTYPE. The organism
is where a change is cheap to try; the artifact is how it is inherited. If HYBRID
wins, the answer is not "live" or "external" but "explore live, inherit
external", and every substrate finding slots in underneath as mechanism.

DISCIPLINE INHERITED FROM B10 AND B11, non-negotiable:
  - paired arms from an identical checkpoint, spread reported, never a bare mean
  - sign consistency across pairs carries the result, not the means
  - pre-register the prediction before the first scored run
  - a proxy is not the property: "the agent wrote a tool" is not improvement,
    and the only evidence that counts is later-task performance
"""
acceptance = [
  "four arms over B14's sequence, from an identical starting state, with later-task score reported before any efficiency number",
  "the result stated as a fraction of B14's hand-written ceiling, so 'improved' has a scale",
  "held-out transfer reported separately from training-sequence improvement, whatever it shows",
  "the agent's CHOICE of surface recorded per mutation, including the times it chose to do nothing",
  "improvement latency measured for the live and externalised arms, against B11's +2,989-token restart",
  "regressions reported -- a promoted change that broke a previously passing task counts against the arm",
  "pre-registered before the first scored run, as B10 and B11 were",
]
kills_it = "No arm beats CONTROL on the later tasks. Then self-modification does not produce self-improvement on this workload, the four substrate probes were answering a question that does not arise, and that is the most valuable negative result the project could produce."

[[story]]
id       = "B7"
sprint   = 0
title    = "Smalltalk probe: does the durability advantage show up in outcomes?"
labels   = ["backlog", "spike", "risk"]
status   = "done"
size     = "M"
depends_on = []
as_a     = "researcher"
i_want   = "three measurements on Pharo, not a port"
so_that  = "the substrate question is decided by evidence rather than by which architecture diagram reads better"
notes = """
SPINOFF, deliberately outside the main line. Runs in its own session and must not
consume the vivarium track.

Smalltalk is more genuinely an image than SBCL is, and the project's question is
about images -- so the substrate choice deserves evidence rather than loyalty.
What makes it a probe and not a port: three questions, no task set, no harness.

  1. SNAPSHOT UNDER LOAD. Pharo's snapshot:andQuit:false while something is
     actually serving. How long is the pause, and are in-flight requests lost?
     SBCL's fork-and-save costs ~388ms and loses control flow entirely.
  2. RESUME MID-COMPUTATION. Start a long computation, snapshot, restore,
     confirm it CONTINUES. This is the one thing SBCL provably cannot do:
     a core taken mid-loop at step 5 restores with counter=5 and then starts
     at toplevel rather than finishing the loop.
  3. DERIVED SCHEMA. Read a tool schema off a live method -- selector keywords
     give argument names, reflection gives the rest. The load-bearing claim of
     this whole project, tested on the other substrate.

WHY NOT SWITCH NOW, so the spinoff does not turn into a migration: nothing
currently open depends on B6. Trials are ephemeral by design (fork, score,
_exit) and E4's self-edits need to survive a TURN, not a process death. And the
ledger would still be needed on Pharo -- image rot, unreproducible artifacts and
the whole Monticello/Metacello/Tonel lineage are what a per-definition ledger
answers. Switching restarts the INSTRUMENT, which is the scarce thing: every
measured number here is SBCL-specific.

Pharo is not installed on this machine.

DONE 2026-08-11. Full report: docs/smalltalk-probe.md. Recommendation stands --
do not switch -- but NOT for the reason the first pass gave, and the case is much
closer than it first read.

FIRST PASS WAS WRONG ABOUT THE HEADLINE, and the correction matters. Only Pharo
was run, and the current PHARO/COG VM BUILD cannot reserve its JIT code zone
under macOS 27's address layout (0/5 starts on stable, 0/5 on latest), so
everything went through Rosetta and M1 came out as "590 ms vs SBCL's 30 ms, 20x".
Native ARM64 Smalltalk is FINE: the upstream OpenSmalltalk Cog VM
(202606270913, macos64ARMv8) starts first time here and runs every probe, JIT and
all. The failure is one vendor's VM build, not the architecture and not
Smalltalk. Adding Squeak 6.1 on that VM, plus a Rosetta control on the SAME
Squeak image, splits the difference cleanly:

    native arm64   209 204 203 206 ms      x86_64/Rosetta  811 651 643 630 ms
    -> a 3.1x translation penalty, and Pharo/Rosetta (587-823) lands exactly on
       Squeak/Rosetta (630-811). Held at one architecture the two dialects do the
       same work at the same speed, so a native Pharo VM would land near 205 ms.

  1. SNAPSHOT UNDER LOAD. Squeak native ARM64: 214/215/214 ms, 51.3 MB image,
     0 completions during the pause, ZERO in-flight lost (8 per run). Pharo under
     Rosetta: 587/823/589 ms, 58.7 MB, also ZERO in-flight lost. 48 in-flight
     requests across six runs on two dialects, none lost. Load costs nothing
     (idle 203-209 / 577-598).
     THE GAP IS 7x, NOT 20x -- and it is not a quality gap. Per megabyte Squeak
     writes its heap at 4.0 ms/MB against SBCL's child at 6.2-11.6. SMALLTALK IS
     NOT SLOWER AT CHECKPOINTING; IT IS SLOWER AT STAYING AVAILABLE WHILE IT
     CHECKPOINTS, because it does the work in the process that is serving. That
     is one technique apart -- fork -- not one architecture apart.
     And natively the pause hides: a handler asleep in a Delay does not pay for a
     freeze it slept through, so the penalty is max(0, pause - work still owed).
     With a 214 ms pause and 300 ms handlers the measured cost was a 25 ms
     latency tail (max 356 vs 331 baseline). Pharo's Rosetta-inflated 587 ms
     pause could not hide and cost up to 538 ms.
  2. RESUME MID-COMPUTATION. YES, exact, on BOTH dialects. Stack-local
     accumulators resumed at sum=561 (= sum 1..33, Pharo) and sum=630
     (= sum 1..35, Squeak) and ran on to 7140 and 8515, both arithmetically
     exact; a 13-deep call chain unwound reporting every frame's OWN marker, so
     frames entered before the snapshot returned their locals after it; a
     semaphore-blocked process continued; the main process resumed on the
     statement AFTER the snapshot rather than at a toplevel. Restore 458-510 ms
     native, 976-1010 ms under Rosetta. Three independent restores of one
     checkpoint resumed identically on both -- a checkpoint is a replayable
     resume point, not a one-shot.
  3. DERIVED SCHEMA. WORSE, and the second dialect proved it is the SMALLTALK
     SOURCE MODEL rather than Pharo packaging. Selector keywords are the wrong
     names: in orderTotal:tax: the first keyword names the OPERATION, not the
     first argument, so keyword-derived names give {"orderTotal": <line items>}.
     The usable names are NOT IN THE IMAGE. Move .changes aside and the same
     live method still returns 42.0 while reporting #(#arg1 #arg2) with a nil
     comment on Pharo and ('t1' 't2') with a nil comment on Squeak -- each
     dialect inventing different placeholders, which is a tidy demonstration
     that nothing real is being recovered. The SBCL control is the other way: a
     function defined at runtime from a string, saved to a core, run with the
     source deleted, still reports (LINE-ITEMS &KEY (TAX 0.0)) and its docstring.

THE KILL CRITERION FIRES ON CLAUSE 1, BUT WEAKLY -- weakly enough that the
recommendation no longer rests on it. B6's 388 ms is a WHOLE-OPERATION number;
the parent is not stopped for it. Measured here
(docs/probes/smalltalk-p1-sbcl-comparison.lisp), the parent's worst stall during
fork-and-save is 31.4/36.0/29.6 ms -- the fork() call -- while the whole
operation reproduces at 261-461 ms for a 37.2 MB core.

  SBCL stops the serving process for ~30 ms. Native Squeak stops it for 214 ms
  stop-the-world -- but only 18-75 ms FORKED (M4).

STATED AT THE WIDTH THE EVIDENCE BEARS, and the first draft of this note
overclaimed it as "strictly dominates": FOR THE CHECKPOINT SEMANTICS TESTED HERE,
SMALLTALK MATCHES SBCL'S LOW-PAUSE FORK-AND-SAVE WHILE ADDITIONALLY PRESERVING
CONTROL FLOW. That is not general dominance -- M3 is an axis where SBCL is ahead.
And M4's claim is narrow on purpose: FORK-AND-IMMEDIATELY-CHECKPOINT APPEARS
VIABLE, not "forked Pharo processes are safe general-purpose runtime clones". The
child writes an image and dies; a child that tried to LIVE post-fork would be
holding inherited mutex state whose owner threads are gone, which is exactly what
the kevent complaints are evidence of.

Clause 2 does NOT fire: resume-mid-computation is not fragile. Five failure
modes found, all handleable, two worth naming because they are SILENT:
  - an unregistered Pharo ZnServer restores reporting isRunning TRUE and
    isListening FALSE, refusing connections while claiming to serve. Registered
    via startDefaultOn: it is re-created by the session manager and answers
    normally -- and Squeak's WebServer came back by itself with no registration.
  - SQUEAK BLOCKS FOREVER WHEN AN AGENT INSTALLS A METHOD: compile: in a
    headless image hangs with no error and no output, waiting on the
    author-initials dialog, until Utilities authorInitials: is set. That is
    squarely on B7's path -- a harness whose agent defines methods at runtime
    deadlocks on its first write until someone knows this.
  - a file stream held open across a snapshot returns closed and raises
    FileWriteError (loud, therefore safe); and a saved Pharo image restarted
    without --no-quit prints its usage and dies a second after resuming, which
    looks exactly like resume not working.

So Smalltalk's advantage is NOT merely architectural: it is real, measurable and
exact. What holds the recommendation up is now (1) M3, which got STRONGER when
the second dialect confirmed it, (2) nothing open needing control-flow resume,
and (3) instrument continuity. Do not switch -- but it is close.

  4. FORK-AND-SNAPSHOT (M4, added after review). YES -- and this removes the
     runtime objection entirely. fork() via uFFI from inside a Pharo image, child
     saves and exits, parent keeps serving. 15 forks across two runs while the
     image served traffic AND churned the heap AND ping-ponged semaphores AND
     wrote files AND compiled methods (5116 GC churns, 4273 semaphore handoffs,
     2945 file writes, 2383 methods compiled concurrently).
       PARENT STALL 18-75 ms, against SBCL's OWN 29.6-36.0 ms -- and that is
       Pharo under Rosetta, so the number is pessimistic.
     827/827 requests finished, ZERO in-flight lost, latency across the fork
     maxed at 307.5 ms against a 490.5 ms baseline: the fork did not even cause
     the worst gap of the run. All 15 children wrote valid images; every one
     tested restarts, resumes MID-COMPUTATION and serves -- restored images
     reported their own checkpoint counters (fork-1 churn=1879, fork-5 churn=3334,
     fork-10 churn=4977, monotonic in fork order) and kept incrementing.
     Cost: the forked child's inherited kqueue logs 'kevent: Bad file descriptor';
     the parent is measurably unaffected and restored images log zero. Limits:
     Pharo-only, because SQUEAK 6.1 BASE HAS NO FFI AT ALL (no
     ExternalLibraryFunction, no Alien, no plugin). Probe 4b then hardened the
     primitive -- child calls _exit directly instead of returning through
     quitPrimitive, so the VM's shutdown machinery never touches resources it
     inherited but does not own -- and soaked it under the same load plus forced
     full GCs. saveAs: was deliberately KEPT rather than dropping to the bare
     snapshot primitive: its session shutdown/startup hooks are what re-create
     sockets on resume, and an image that cannot restore is worth nothing however
     fast it was written.
     SOAK RESULT, 250 forks at 200 ms spacing -- deliberately faster than sane:
     0 fork failures, 3134/3134 requests finished, 0 lost, and _exit proved SAFE
     (images boot, carry checkpoint state, restore their listener, and serve a
     real HTTP round-trip from inside the restored image -- worth checking,
     because _exit skips atexit and stdio flushing and could have truncated a
     buffered image write). THE MECHANISM NEVER FAILED; THE RATE DID. Parent
     stall min 30 / p50 62 / p90 597 / p99 2723 / max 6405 ms, 45 of 250 over
     200 ms.
     PROBE 4C TRIED TO TURN THAT INTO A SATURATION CURVE AND FAILED, WHICH
     RETRACTS THE OBVIOUS READING. Sweeping the spacing gave a NON-MONOTONIC
     result -- 3000ms: p50 102 p90 961 max 4828; 1500ms: p50 120 p90 387 max
     17348; 750ms: p50 56 p90 206 max 1299; 375ms: p50 142 p90 383 max 2822 --
     with p99 == max in every row, which is the tell that n (40-80) is far too
     small for a p99. Re-running the SAME 3000ms configuration later gave max
     560 ms with the forced GC and 440 ms without: an order of magnitude below
     the same config's 4828 ms.
     So the seconds-scale outliers are NOT caused by checkpoint rate, are not
     reproducible at a fixed configuration, and look like machine noise on a
     contended host. The forced full GC that 4b/4c added and M4 lacked explains
     part of the SUB-SECOND tail (p90 265 -> 163 without it) and nothing like the
     multi-second events.
     WHAT SURVIVES: the median fork stall is small and rate-insensitive (56-142
     ms across 375-3000 ms spacing, under Rosetta, under load); nothing ever
     failed (0 fork failures, 0 lost requests across 475 forks); and THE TAIL IS
     UNATTRIBUTED. Measuring it needs a quiet host, n in the thousands, and an
     OUT-OF-IMAGE clock -- the in-image bracket around fork() can itself be
     descheduled by the green-thread scheduler and will charge another process's
     work to the fork. Read M4's 18-75 ms (n=15) and SBCL's 29.6-36.0 ms (n=3)
     the same way: both are small-sample, and the honest comparison is SAME ORDER
     OF MAGNITUDE, not a ranking.
     Checkpoint-as-resource-with-backpressure (defer or coalesce while a previous
     writer is still going) remains the right design, but it is design judgement
     here, not a measured result.
  5. HEADLESS AUTONOMY AUDIT (M5, added after review). The author-initials hang
     is real but SHALLOW. Fifteen operations classified OK / RAISED (catchable,
     therefore data) / BLOCKED, with the watchdog outside the image because a
     modal dialog cannot report itself. Squeak native: exactly ONE blocked --
     compiling a method in the image as it ships -- fixed by one message send,
     Utilities authorInitials:. Malformed source RAISES SyntaxErrorNotification;
     a debugger in one green process does NOT freeze the image; closed-port
     connect raises ConnectionRefused; class create/rename/reparent/remove all
     fine; a 400M-element allocation succeeds. Pharo spot-check: NO blocking
     hazard at all on the same compiles -- its non-interactive investment shows.
     THE QUIET HAZARDS MATTER MORE THAN THE LOUD ONE: both dialects compile a
     method referencing an UNDECLARED VARIABLE silently, so an agent's typo
     installs clean and fails later; and Squeak binding an already-bound port
     returned success instead of raising. Neither hangs; both are failures that
     did not become data, which is the same criterion failing where it is harder
     to audit. So the audit sorts into THREE classes -- blocking (agent freezes),
     explicit (agent recovers), and SILENT SEMANTIC (agent believes the change
     succeeded and corrupts itself). The third deserves its own metric, which
     neither substrate has been measured on:
       MUTATION OBSERVABILITY -- when the agent changes itself incorrectly, how
       reliably does the substrate turn that mistake into observable evidence?
     Arguably more important than headless autonomy. Note what it does NOT imply:
     better live mutation mechanics do not remove the need for validation,
     provenance, rollback, evaluation and selection. vivarium's evaluator earns
     its place on either substrate.

THREE THINGS THIS SENDS BACK:
  - B6's kills_it tests the wrong quantity. "The ~400ms fork-and-save pause" is
    not a pause; the pause is ~30 ms. B6 is much further from firing than it
    reads.
  - B6's GENOME/CORE trap is WORSE on Smalltalk, not better. The source an agent
    installs does not live in the artifact -- it lives in .changes. A
    per-definition ledger is not merely still needed there; it recovers
    something SBCL never loses.
  - M1's own framing was wrong. The difference is FORK vs STOP-THE-WORLD, not
    Lisp vs Smalltalk: per megabyte Squeak writes its heap at 4.0 ms/MB against
    SBCL's child at 6.2-11.6. If a Smalltalk image can be made to fork safely --
    green Processes say yes, the VM's OS-level heartbeat thread says measure it
    -- the availability argument disappears entirely. Untested; obvious next.

ALSO CORRECTED, in vivarium's own code: derive.lisp's header claimed SBCL yields
(FUNCTION (LIST &KEY (:TAX SINGLE-FLOAT) ...)) with no help. On 2.6.7, via both
eval and compile-file, it yields (FUNCTION (T &KEY (:TAX T)) (VALUES NUMBER
&OPTIONAL)) -- the RETURN type is derived, argument types are T unless declared.
Nothing downstream is wrong (json-type maps that to "any" and build-parameters
refuses to guess), but the comment overstated the input; now fixed. The
derived-schema claim rests on NAMES, ARITY KINDS and the DOCSTRING, precisely
the set SBCL keeps in the image and Smalltalk keeps in a side file.

TRIGGER -- what would make switching correct. NECESSARY, AND NOW MEASURABLE:
continuation persistence has to improve OUTCOMES. B7 has very nearly finished
proving Smalltalk CAN preserve live computation; it has not shown the capability
makes an agent better, and that is the difference between an elegant runtime
property and an agent capability. Spun out as story B8 -- an A/B with one
variable (reconstruct state from the ledger vs resume the exact live
computation), which needs the task set and a scored loop that B7's terms of
reference excluded. If B wins, the recommendation flips; if A matches B, live
continuation is decoration on a sufficient ledger and the question closes for
good. An adjacent form of the same trigger, if it arrives first: an experiment
whose subject is an agent turn that OUTLIVES ITS PROCESS.

RETIRED: the availability trigger. The first pass set it at "a native arm64 VM
under ~50 ms", against a number that was mostly Rosetta. Measured natively the
pause is 214 ms, costs a 25 ms latency tail on a 300 ms workload and loses
nothing. The availability objection is no longer a reason not to switch; it is a
budget line -- one checkpoint per 214 ms of frozen service, against vivarium's
28-32 ms forked trials. A request SHORTER than the pause would make it visible
again, so re-measure if the workload changes shape.

SUFFICIENT, either: (a) E5's single-tool RLM winning, after which there is no
schema to derive and M3 evaporates -- and with M1 no longer disqualifying that
would leave instrument continuity as the ONLY argument against, which is a
reason to defer rather than to refuse; (b) Smalltalk source moving into the
image (Tonel or anything that keeps method source and comments reachable from
the image alone) -- worth checking before assuming, since the finding here is
about .changes and sourcePointer, not about what a package format could do.

Conversely, if SBCL ever gains control-flow resume by representing in-flight
work as DATA rather than as a stack -- which B6 already gestures at -- Smalltalk's
one genuine advantage is gone and the question closes permanently.
"""
acceptance = [
  "a number for the snapshot pause under load, beside SBCL's 388ms fork-and-save",
  "resume-mid-computation demonstrated or shown not to work in practice",
  "a tool schema derived from a live method, or a written reason it cannot be",
  "a recommendation with a trigger: what result would make switching correct",
]
kills_it = "Pharo's snapshot pause under load is no better than SBCL's, or resume-mid-computation is fragile in practice. Then Smalltalk's advantage is architectural rather than measurable and the substrate question closes in vivarium's favour."

[[story]]
id       = "B10"
sprint   = 0
title    = "Does preserving live cognition make the agent better?"
labels   = ["backlog", "experiment", "substrate"]
status   = "halted"
size     = "M"
depends_on = ["S1"]
as_a     = "researcher"
i_want   = "an A/B on checkpoint semantics, with everything except the resume mechanism held fixed"
so_that  = "continuation persistence is judged as an agent capability rather than as an elegant runtime property"
notes = """
SPUN OUT OF B7, which proved the CAPABILITY and could not test the OUTCOME --
B7's terms of reference excluded the task set and a scored loop, and this needs
both.

B7 established, measured: a Smalltalk image resumes exact live computation across
a restart (stack locals, a 13-frame call chain, semaphore-blocked processes),
deterministically, and can do it via fork with an 18-75 ms serving pause against
SBCL's 30-36 ms. So Smalltalk CAN preserve live cognition at SBCL-class cost.
Nothing shows it makes an agent BETTER, and that gap is the whole remaining
argument for switching substrate.

THREE ARMS, NOT TWO, AND THE ORDER MATTERS. Comparing SBCL against Smalltalk
directly would confound two different effects: a Smalltalk win could simply mean
the SBCL checkpoint schema was not rich enough. So the first comparison is
SBCL AGAINST ITSELF, and Smalltalk only enters once the explicit arm is at its
best:

  A1  NAIVE RECONSTRUCTION.  Persist goal, history, artifacts, current task.
      The agent works out where it was.
  A2  EXPLICIT DURABLE COGNITION.  Persist goal, current hypothesis, current
      subproblem, candidate set, rejected candidates, tool results, next action,
      unresolved branches, partial computations, evaluation state.
  B   CAPTURED COMPUTATION.  The image resumes: stack, frame, locals, green
      process, instruction position.

    A1 -> A2   measures the benefit of BETTER EXPLICIT REPRESENTATION
    A2 -> B    measures the benefit of CAPTURING COMPUTATION ITSELF

Each step then asks exactly one question, and A1->A2 is runnable on SBCL alone
before Smalltalk is introduced as a variable at all.

THE QUESTION, precisely: WHAT INFORMATION, IF ANY, EXISTS IN AN AGENT'S RUNNING
COMPUTATION THAT IS EXPENSIVE OR LOSSY TO EXTERNALISE INTO EXPLICIT DURABLE STATE?

SUCCESS RATE IS NOT THE OUTCOME -- a vector is, because the interesting result is
success(A2) ~= success(B) with everything else worse for A2:

  final task score            capability
  total LLM tokens            reconstruction cost
  tool calls                  duplicated work
  wall time                   operational effect
  lost / repeated steps       continuation fidelity
  state serialization size    the explicit-state burden
  harness code complexity     the implementation burden
  recovery failures           robustness

RUN IT IN STAGES. A1 -> A2 FIRST, ON SBCL ALONE, and do not add arm B until the
A2 representation and the reconstruction-tax instrument have both been validated.
If A1 shows substantial reconstruction tax and A2 drives it to ~zero, that is a
result worth having with no Smalltalk involved at all -- and if the instrument
cannot show that cleanly, it is not ready to adjudicate the harder comparison.

RECONSTRUCTION TAX, defined formally rather than as an impression:

  work performed after recovery whose only purpose is to recover information,
  decisions, intermediate results, or execution position that was already
  available immediately before the checkpoint.

AND IT NEEDS A COUNTERFACTUAL, because the concept is partly semantic and will
otherwise be labelled by intuition. "The agent re-read file X after restart" is
NOT automatically reconstruction: it might have re-read X anyway. So measure by
PAIRED RUNS rather than by classifying operations:

  same task, same seed, same model, same checkpoint location
    CONTROL       continue uninterrupted past the checkpoint
    RECOVERY ARM  restart and resume from it
  compare POST-CHECKPOINT behaviour between the two.

The difference is the tax, and it falls out as extra tool calls, extra reads,
extra reasoning tokens, repeated experiments, repeated rejected candidates, lost
hypotheses and wall-clock delay -- none of which requires anyone to decide by eye
what a given operation "was for".

  Quantify as reconstruction_tokens, reconstruction_tool_calls,
  reconstruction_wall_time, repeated_observations, repeated_experiments,
  repeated_failed_candidates, lost_hypotheses.

  RECONSTRUCTION TAX RATIO = reconstruction work after restore / total work after
  restore -- interpretable across tasks of different sizes. A run can succeed and
  still burn 2,800 tokens, 4 tool calls and 17 seconds rediscovering where it was,
  which is exactly the effect a success rate hides.

STATE-AUTHORING TAX, the metric that keeps the comparison fair. Explicit durable
state is not free: forcing the agent to externalise every useful implicit thought
into (:current-hypothesis ...) (:next-action ...) (:pending-experiment ...)
(:candidate-rejected ...) reduces reconstruction tax by RAISING the cost of
ordinary execution -- tokens spent narrating state, harness code maintaining the
machine, serialisation on every transition. Smalltalk's implicit continuation
does not require any of it. So the honest comparison is:

  EXPLICIT PERSISTENCE     while running: externalise state, maintain the state
                           machine, serialise transitions
                           after recovery: small reconstruction

  COMPUTATIONAL CAPTURE    while running: almost nothing
                           at checkpoint: capture a larger computational world

  DURABILITY TAX = state-authoring overhead + checkpoint overhead
                 + reconstruction overhead

That is the number with real bite, and neither substrate has one. Note what it
implies for tuning A2: THE STRONGEST A2 IS NOT THE ONE WITH THE LOWEST
RECONSTRUCTION TAX. It is the one minimising TOTAL durability tax without hurting
task score -- an A2 that externalises everything will win on recovery and lose on
every ordinary turn, and reporting only the first half would manufacture a result.

MEASUREMENT VALIDITY IS PART OF THIS STORY, NOT A PRELIMINARY TO IT. B7's own
history is the argument: four confident claims there turned out wrong under a
better instrument -- a 20x figure that was mostly Rosetta, an "arm64 never starts"
that was one vendor's VM build, a smoke test that false-positived because crash
dumps contain the digits 42, and a saturation curve that was machine noise. Every
one was caught by CHANGING THE INSTRUMENT rather than by running more of the same
measurement. Reconstruction tax and state-authoring tax are both easy to measure
badly and hard to measure well, and a confident number from a bad instrument would
be worse here than no number at all.

Arm A is what SBCL can do today and what a file harness approximates. Arm B is
what only an image can do. The interesting quantity is not whether B is faster --
it will be -- but whether B ARRIVES SOMEWHERE A CANNOT, i.e. whether work in
flight at checkpoint time carries information the ledger does not.

WHY THIS IS THE DECIDING EXPERIMENT. If B consistently wins, continuation
semantics become a reason to move and B7's recommendation flips. If A matches B,
live continuation is decoration on a ledger that was already sufficient, and the
substrate question closes for good. Either result is worth more than any further
microbenchmark, and both are cheap relative to a port.

PRE-REGISTERED 2026-08-11 in docs/b10-preregistration.md, before any scored run:
tasks (train split only, held-out unspent), model, temperature, checkpoint rule
(after the 4th tool result, one per run, fixed ordinal so it cannot be chosen
after seeing a trace), the paired-control design, both representations, and every
metric definition. Frozen means frozen: if one has to change, the runs made under
the old version are discarded rather than reinterpreted.

AMENDED the same day, before any scored run, with five rules and one finding that
came out of re-reading S2c rather than out of design:

  S2C ALREADY MEASURED THE NOISE FLOOR AND IT IS NOT SMALL -- two identical sweeps
  disagreed on 6 OF 25 CELLS, 24%, at temperature 0 with a fixed seed. Hosted
