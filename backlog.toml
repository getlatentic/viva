Only the arms change: FULL keeps the transcript, DISTILLED replaces it with a
HARNESS-PRODUCED summary of hypotheses, conclusions and unresolved work, LEDGER
is B10's recovery arm unchanged.

Harness-produced rather than agent-authored ON PURPOSE: that isolates "is the
raw transcript worth its tokens" from "should the agent author its own state",
which is B10's A2 and is not this experiment. The summariser call is charged to
