notes = """
FILED, NOT SEQUENCED. It does not run before B12 and must not derail the frozen
order. Recorded now only because B11 makes the question precise and the reason
for it will be harder to reconstruct later.

B11 MEASURED TWO SEPARATE THINGS AND FOUND THEM COUPLED BY THE MECHANISM RATHER
THAN BY NECESSITY:

  compression itself   USEFUL      LEDGER - SHAM  =  -2,400 tokens, 25/34
  restart itself       EXPENSIVE   SHAM   - FULL  =  +3,000 tokens, 31/34
                                                     -------------
  so the combination lost          LEDGER - FULL  =    +600 tokens, 22/34

Every compressed arm in B11 was also a RESTARTED arm, because the instrument
was B10's fork-and-rebuild harness and compression was expressed by handing a
different context to a rebuilt agent. Nothing in the finding requires that. An
agent can keep running -- same object, same tools, same in-flight state -- and
have its accumulated conversational history replaced in place.

  FULL                  vs   IN-PLACE COMPACTION
  keep the transcript        keep the agent, replace the history

THE PREDICTION, recorded now so it is a prediction: about -2,400 tokens of
compression saving with none of the +3,000 restart tax. If that holds it is the
combination B11 could not produce. If in-place compaction ALSO costs ~3,000,
the restart was never the cause and B11's decomposition is wrong -- which is the
result worth having either way.

WHAT IT MUST NOT INHERIT FROM B11:
  - the summariser. B11's frozen summariser was measured and lost; reusing it
    would test the same losing distillation through a new mechanism. Compact to
    the LEDGER representation, which is the arm that actually saved tokens.
  - the task set alone. B11 found LEDGER - FULL reversing sign between family D
    and everything else. Spread across families or the result is about tasks.

WHY IT IS NOT FREE: this needs a harness that can rewrite an agent's history
mid-run without a fork, which vivarium's E3 mechanism (prompt and tools re-read
per request) makes plausible but does not supply. That machinery is the story.
"""
acceptance = [
  "in-place compaction measured against FULL on the same tasks and checkpoint discipline as B11, so the two results are comparable",
  "the restart tax shown absent or present -- if in-place compaction costs the same ~3,000 tokens, B11's decomposition is refuted and that is the finding",
  "spread reported and sign consistency across pairs, never a bare mean",
  "cross-family, with the family-D contrast reported separately as B11 did",
]
kills_it = "In-place compaction costs what the restart cost, or the saving evaporates once the agent keeps its own state. Then compression and restart were never separable in this harness and B11's operational rule stands unchanged as the final word."

