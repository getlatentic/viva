#  vivarium backlog
#
#  Ordered by dependency, not by cost. The list is short at the top on purpose:
#  one story unblocks five, and nothing below it can start.
#
#  A sprint here is a vertical slice of the research journey, so the test of a
#  sprint is not "code shipped" but "the researcher can state one more claim and
#  defend it". A sprint that only builds machinery has shipped nothing.
#
#  Every story is in a sprint or has status = "backlog". No orphans.

[meta]
project   = "vivarium"
question  = "What does an agent harness gain when the agent's world is a running image rather than a directory of files?"
updated   = "2026-08-08"
source    = "HANDOFF.md is the prose; this file is the order of work."
sizing    = "size, not due dates: an experiment's length is unknown until its instrument exists. Time-box at sprint planning instead."

# The spine. Sprints are slices of this, in order.
journey = [
  "1. a question with kill criteria                 -- done",
  "2. a harness that can act in the world           -- done",
  "3. an instrument that measures outcomes          -- done, S1",
  "4. a control honest enough to compare against    -- next, S5",
  "5. verdicts on the cheap experiments             -- next, S3 and S4",
  "6. verdicts on the headline experiments          -- blocked on 4",
  "7. evidence the result survives outside the lab  -- blocked on 6",
]

# ---------------------------------------------------------------------------
#  Already answered. Recorded so nobody re-researches it, not as work.
# ---------------------------------------------------------------------------

[[settled]]
ref   = "E1"
claim = "An isolated trial in a live image costs milliseconds."
result = "Holds. Fork 28-32ms, saved core 75ms, cold start 2600ms, in-process 0.12ms. SBCL refuses to fork multi-threaded, so a zygote is mandatory and the serving image can never fork. Parallel fan-out barely beats sequential."

[[settled]]
ref   = "E2 claim 2"
claim = "A Pareto frontier beats greedy keep-best."
result = "Holds, narrowly: the frontier converts a hard trap into a budget question at a measured 10x price. Greedy frozen at n=12 at every budget; Pareto reaches the global optimum at 600. NOT 'Pareto wins at equal budget'."

[[settled]]
ref   = "E3 mechanism"
claim = "Mutating a live agent object changes what it can do on the next request."
result = "Built and tested: prompt and tool set read per request; abort-in-flight measured at 1,927ms vs 323,875ms. Whether it improves OUTCOMES is story S6."

[[settled]]
ref   = "E6"
claim = "What production harnesses fix at turn start versus re-read per request."
result = "DONE -- all four harnesses read. opencode re-reads prompt AND tools per request (prompt.ts:1088 loop, SessionTools.resolve inside it, LLMRequestPrep.prepare per run) with a plugin hook for rewriting the prompt, so 'resolved at startup' is false in general. But resolveTools is a FILTER that never adds, so no harness can acquire a tool absent at session start. Answered for Codex, Pi and Claude Code. Claude Code's control protocol accepts set_model, set_permission_mode, interrupt, stop_task, rewind_files, mcp_toggle -- no set_system_prompt, no set_tools. mcp_toggle is a PRE-REGISTERED server on/off. opencode remains unread (S2)."



[[settled]]
ref   = "harness"
claim = "The image is a viable agent world."
result = "Arm A repairs a broken definition in a running image (TYPE-ERROR to 35, verified by calling it) and extends itself mid-run (7 tools to 8, no restart). 272 assertions green."

# ===========================================================================
#  SPRINT 1 -- The instrument
# ===========================================================================

[[sprint]]
id    = 1
name  = "The instrument"
goal  = "Make outcomes measurable at all."
ships = "A benchmark on which a file-based harness structurally cannot score full marks -- and the honest statement of what it does and does not cover."
why   = "Every open experiment is blocked on the same missing object. The project has three prompts over two functions and one numeric landscape; everything else is machinery operating on a toy."

[[story]]
id       = "S1"
sprint   = 1
title    = "A task set where imageness is load-bearing"
labels   = ["user-story", "risk"]
status   = "done"
size     = "L"
depends_on = []
blocks   = ["S3", "S4", "S5", "S6", "S7", "S8"]
as_a     = "researcher"
i_want   = "a set of tasks in a live image, each with a starting state and a score computed by calling into the image"
so_that  = "a win over a file-based harness means something instead of being an artefact of the task I happened to write"
notes    = """
BUILT 2026-08-08 -- vivarium/tasks, 913 lines, 14 tasks, 42 cases, 357 assertions
green. Each task is pinned by two tests: it FAILS before a fix and PASSES
completely under a known-good one, with the answer key in tests/ so nothing on
the agent path can reach it. Scored through a forked trial at 43-62ms.

docs/task-set.md holds the decision record: 14 tasks, the interface,
the held-out split, and what the set does not cover. Build against that.

This is the root and the whole project waits on it. The design risk is bigger than
the build risk: if the tasks are 'write a pure function from a docstring', files do
fine and the headline question gets no answer.

CORRECTION to this story as first written. It listed four imageness dimensions;
three of them collapse into one root. A file harness cannot observe or preserve
STATE THAT EXISTS ONLY IN THE RUNNING PROCESS and was never produced by loading
source. 'Diagnose from runtime-only information' is that state; 'keep serving' is
how that state dies. So: one task-level asymmetry with three faces, plus one
separate harness-level asymmetry (acquiring a capability mid-run). Four families,
two roots.

Honest caveat that must not be quietly dropped: give a file harness a
REPL-over-socket tool and the distinction dissolves -- but that harness is an image
harness with extra steps, which is the thesis rather than a counterexample. What
must never happen is granting the control that tool and reporting a null result.

FORCED BY E1, and nearly missed: check-zygote errors unless exactly one thread is
running, so a task whose setup spawns a thread cannot be scored in a forked trial
at all. The 'keep serving' family therefore models in-flight work as runtime state
-- half-completed operations, captured closures -- rather than running concurrent
traffic. The whole set is single-threaded and that is a constraint, not a taste.

Build it inside vivarium, NOT against genera-lab. E1 already settled that argument:
the zygote's warm state is loaded code and fixtures, not the serving image's live
sessions, so genera-lab's realism does not survive the fork. Paying an external,
un-versioned dependency buys nothing on the path that scores. genera-lab is the
external-validity check later (S9), not the starting point.
"""
acceptance = [
  "14 tasks per docs/task-set.md, each with a live starting state established before the agent runs",
  "every score is computed by calling into the image; no score reads the agent's report -- the fabricated-REPL-transcript failure must be impossible by construction",
  "scores are per case, never a scalar -- a single number makes a Pareto frontier impossible and silently collapses the search into greedy",
  "at least one scoring dimension a file-based harness cannot score full marks on, and a written argument for why it cannot",
  "candidates can carry MORE THAN ONE definition -- this is the specific gap that makes E2 claim 1 unmeasurable today",
  "a held-out split is fixed now and recorded, before anything is tuned against the training half",
  "tasks are seeded and a repeat run reproduces its scores",
  "each of the four families has at least two tasks, including a conflict task and a clean-merge task for E2 claim 1",
  "no task setup spawns a thread -- check-zygote would refuse to fork the trial",
  "every case returns a number in [0,1], so scores are comparable across tasks",
  "a written statement of what the set does NOT cover",
]
tasks = [
  "design the scenarios and the scoring interface, and get them reviewed, before writing the module",
  "src/tasks/ -- a task is (setup, prompt, cases); a case returns a number or signals",
  "wire it to trial:run-trial, whose ((name . thunk) ...) shape already fits",
  "fix the held-out split and commit it",
  "record the file-harness argument in docs/",
]
kills_it = "The file-based control scores full marks on every dimension. Then the task set is measuring coding ability, not the substrate, and it has to be redesigned before anything downstream is worth running."

[[story]]
id       = "S2"
sprint   = 1
title    = "Read opencode, the last unread harness"
labels   = ["spike"]
status   = "done"
size     = "S"
depends_on = []
blocks   = ["S6"]
as_a     = "researcher"
i_want   = "to know whether opencode re-reads its prompt or tool set per request"
so_that  = "E3's claim is stated against every production harness on this machine, not most of them"
notes    = """
DONE 2026-08-08, and it DID narrow E3 -- the third time. opencode is the only
one of the four that re-reads both prompt and tool set per request:
prompt.ts:1088 is a plain while(true), one request plus its tool batch per
iteration; SessionTools.resolve runs INSIDE it (prompt.ts:1226); and
LLMRequestPrep.prepare rebuilds the system prompt on every LLM.run
(llm/request.ts:56). There is even a plugin hook, experimental.chat.system.transform,
whose only purpose is letting an external party rewrite the prompt per request.

So "prompt and tools are resolved at startup" describes Pi and Codex, NOT every
production harness. That version of E3's claim was too broad and is retracted.

What survives, and it is sharper: re-reading is not acquiring. resolveTools is
Record.filter over a registry assembled upstream (llm/request.ts:208) -- it
removes what permission disabled and never adds. Same shape as Claude Code's
mcp_toggle. No harness lets an agent acquire a capability that was nowhere at
session start, with the schema derived from the thing it just wrote. That is now
the only part of the claim standing, and it is what S6 tests.

Independent of S1, so it can run alongside. Vendored at
~/workspace/harness-test/vendor/opencode, 137 MB of TypeScript, never opened.
Time-boxed: request assembly and turn boundaries only, no further.

Do this BEFORE designing S6, not after. If opencode already mutates capability
mid-run, E3's claim narrows for the third time and S6 is a different experiment.
Note that vendor/ is one repo holding the trees as plain directories -- a commit
read inside opencode is harness-test's, not upstream's.
"""
acceptance = [
  "one paragraph in docs/e6-harness-teardown.md: what opencode fixes at turn start and what it re-reads",
  "E3's baseline table updated, or explicitly confirmed unchanged",
  "a decision recorded: does this narrow E3's claim?",
]
tasks = [
  "find the loop and the request-assembly path",
  "answer the one question; stop there",
]
kills_it = "opencode mutates prompt or tool set mid-run. Then capability injection is not unclaimed and E3 needs restating."

[[story]]
id       = "S2d"
sprint   = 1
title    = "One entry point for every run"
labels   = ["infra"]
status   = "done"
size     = "M"
depends_on = ["S1"]
blocks   = []
as_a     = "researcher"
i_want   = "a single command that runs any experiment, with the arms, repeats and output shape in one place"
so_that  = "a run is reproducible from its command line and an experiment cannot rot unnoticed"
notes    = """
DONE 2026-08-08. bin/vivarium + src/cli (package, args, arms, commands, main).
Four subcommands: check, tasks, calibrate, compare. .env is loaded by the
launcher so no run depends on the caller having sourced it.

The rot guard was VERIFIED rather than asserted: planting the exact
`*provider*:queued-agent` breakage that killed e5-wire-format.lisp makes
`check` print FAIL and exit non-zero. compile-file is the right instrument --
it catches reader and package errors without executing the experiment or
touching the network.

`compare` turns the hand-rolled two-sweep diff into a command, and --repeats
defaults to 3 rather than 1.

Absorbs the old S2b (experiment-rot guard): one entry point that can load and
compile every experiment IS the guard, and a separate story for it would be a
second thing to forget.

Not speculative -- this is friction paid repeatedly while building S1 and S2c.
Every run is currently `set -a && . ./.env && set +a; sbcl --non-interactive
--load experiments/X.lisp`, each experiment re-implements the quicklisp
bootstrap, env loading, arm construction and reporting, there is no way to run a
subset without hand-writing a scratch file (done twice during calibration), and
`--eval` silently evaluates only the FIRST form in its string, which cost a
debugging round on its own.

experiments/e5-wire-format.lisp had been dead since the provider refactor and
nobody noticed, because nothing ever loaded it.

Repeats belong here too: calibration measured a 24% cell-flip rate at n=1, so
`--repeats` should be a flag with a default that is not 1, not something each
experiment remembers to do.
"""
acceptance = [
  "one command runs a named experiment: arms, task subset, repeat count, output path",
  "it loads .env itself rather than depending on the caller having sourced it",
  "a `check` mode compiles every experiment without a model server or network, and fails loudly on a broken one",
  "results are written in a structured form as well as printed, so a later run can be diffed against an earlier one",
  "the two-sweep comparison done by hand during calibration becomes a command",
]
tasks = [
  "bin/vivarium with subcommands; keep the argument parsing boring",
  "move arm construction out of the experiment scripts and into one place",
  "--repeats defaulting to 3, with spread reported",
]

[[story]]
id       = "S2c"
sprint   = 1
title    = "Calibrate the instrument against a real model"
labels   = ["user-story", "risk"]
status   = "done"
size     = "M"
depends_on = ["S1"]
blocks   = ["S3", "S5", "S6"]
as_a     = "researcher"
i_want   = "a baseline pass rate for every task, from a real model rather than from my own reference fixes"
so_that  = "I know the instrument can tell two harnesses apart before I spend a sprint assuming it can"
notes    = """
DONE, and RE-MEASURED CLEAN 2026-08-11 on all 17 tasks: 102 attempts, zero
contaminated, zero transport failures, mean 6.7 requests of a 12 cap. Verdict
holds and is now trustworthy: THE SET DISCRIMINATES -- five tasks separate the
two models, two are tied-partial, ten are solved by both, NONE by neither. T12
is the hardest (0.22 / 0.44) and models stop well short of the request budget
rather than exhausting it. Table in docs/task-set.md.

Superseding the first sweep: across the 28 shared cells 11 moved and 8 moved UP,
which is the shape of the harness fixes (find-by-package, live-value reading)
rather than of noise -- and understated, since a cell at 1.00 can only fall.
Three things changed at once, so it is direction, not measurement.

Original verdict below, from the contaminated run. 14 tasks x 2 models, mean 8.3
requests of a 12 cap. Five tasks separate the models, none is solved by neither.
Eight are solved by both, which is not waste -- where model capability is not the
bottleneck a failing harness is failing for harness reasons. Table in
docs/task-set.md.

Two things it caught. T9 scored zero for both models and it was the TASK's fault:
the prompt never named the function the cases check, and told the agent to "call
it" with a tool set that cannot call anything. Fixed, now 1.00/1.00.

And the finding that constrains everything downstream: two identical sweeps
disagreed on 6 OF 25 CELLS -- 24% -- at temperature 0 with a fixed seed. Hosted
providers are not deterministic. A single sample per cell cannot support a
comparison. attempt-repeatedly/fraction-summary exist for this; S3, S5 and S6
must use them and report spread, not just a mean. One casualty already: a
first-sweep observation that gpt-oss-120b broke T14's correct definition did not
reproduce.

Delivered the shared runner S3, S5 and S6 all need and none of them owned:
src/tasks/attempt.lisp -- set up, build cases, let an agent act, score the image.
The ordering is the correctness argument: cases must be built before the agent
runs, because a case closes over the world it will later compare against.

CONTAMINATION, found after the sweep and it invalidates deepseek's column on
12 of 14 rows. A scored agent with bash reads the machine hosting the benchmark:
`cat src/tasks/control.lisp` -- the file with its own scoring cases -- and it
wrote verification scripts into the repo root. A cwd jail does not stop it
because absolute paths ignore cwd. bash now refuses paths outside its scratch
directory, and reaching commands are recorded in the results file. The
DISCRIMINATES verdict survives (visible in both sweeps, independent of those
rows); the numbers do not.

Open question this raises for S5: across every trace, not one bash call verified
anything about the live image, because a fresh process cannot see it. In an image
harness bash may be pure liability, and Pi parity is the only argument for
keeping it.

This measures the MODEL, not the harness -- every arm runs the same harness and
tool set. Harness comparisons are S3 and S5.
"""
acceptance = [
  "every task attempted by at least two models through the real agent loop",
  "per-task and per-case scores reported, not just a total",
  "tasks stuck at floor or at ceiling across all models are named",
  "a stated verdict: does the set discriminate, and which tasks need reworking",
  "the runner is reusable by S3, S5 and S6 rather than living in an experiment script",
]
tasks = [
  "src/tasks/attempt.lisp -- the shared runner",
  "experiments/s1-calibration.lisp -- the sweep",
  "rework or retire any task pinned at floor or ceiling",
]
kills_it = "Every task lands at floor or at ceiling for every model. Then the set cannot discriminate and S1 is not done after all -- the tasks need redesigning before any experiment runs on them."

