no observed benefit" stays available; "raw transcripts are unnecessary for
agentic repair" does not.

PREDICTION RECORDED IN ADVANCE, so that finding it later is a confirmation
rather than a story told afterwards: the most consequential outcome is not
LEDGER winning but the MIDDLE arm -- DISTILLED > LEDGER and DISTILLED >= SHAM at
lower cost than FULL, which would say useful cognition exists and the raw
